custom_operator: 
    judgePoint24: customs/twofourpoints.py
variables:
  n: 
    type: int
    domain: "[4, 4]"
    diff_factor: 0
  cards:
    formula: "[random.randint(1, 9) for _ in range(n)]"
symbols: {}
conditions: {}
calc_solution: false
queries:
  q1:
    desc: 已知cards={str(cards)}。如果能得到这样的表达式，则输出答案True，否则返回False。
    ans_formula: judgePoint24(cards)
    ans_text: str(_ans)
    ans_assertion: 'True'
desc: 给定一个长度为4的整数数组 cards 。你有 4 张卡片，每张卡片上都包含一个范围在 [1,9] 的数字。您应该使用运算符 ['+', '-', '*', '/'] 和括号 '(' 和 ')' 将这些卡片上的数字排列成数学表达式，以获得值24。你须遵守以下规则：1、除法运算符 '/' 表示实数除法，而不是整数除法。例如， 4 /(1 - 2 / 3)= 4 /(1 / 3)= 12 。2、每个运算都在两个数字之间。特别是，不能使用 “-” 作为一元运算符。例如，如果 cards =[1,1,1,1] ，则表达式 “-1 -1 -1 -1” 是 不允许 的。3、你不能把数字串在一起。例如，如果 cards =[1,2,1,2] ，则表达式 “12 + 12” 无效。{q1}
