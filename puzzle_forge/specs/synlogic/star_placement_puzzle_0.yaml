custom_operator:
  generate_star_battle: customs/star_placement_puzzle_0.py

variables:
  n:
    type: int
    domain: "[6, 7]"
    diff_factor: 1
  seed:
    type: int
    domain: "[1, 999999]"
  level:
    type: enum
    domain: "['easy','medium','hard']"

  gen:
    formula: generate_star_battle(n, seed, level)

  letters:
    formula: gen['letters']
  letters_str:
    formula: "'\\n'.join([''.join(row) for row in letters])"
  # 修改点：这里获取的是列表，改名为 star_list 以示区分
  star_list:
    formula: gen['stars']
  metrics:
    formula: gen['metrics']

  regions:
    formula: "sorted(set([x for row in letters for x in row]))"

symbols: {}
conditions: {}
calc_solution: false

queries:
  q1:
    # 修改点：更新题目描述，要求输出列表格式 [[r,c], [r,c]...]
    desc: "在一个 {n}x{n} 的 Star Battle 网格上，字母表示分区（每个字母区域为 4-连通）。请放置星星，使得：\\n- 每行恰好 1 颗星；\\n- 每列恰好 1 颗星；\\n- 每个字母区域恰好 1 颗星；\\n- 任意两颗星不相邻（包括对角线）。\\n请按照字母分区顺序（A, B, C...），输出对应区域星星的 1-based 坐标列表（[行, 列]）；例如：[[1, 1], [3, 2]]。"
    ans_formula: star_list
    ans_text: str(_ans)
    # 修改点：更新断言，验证列表类型、长度以及坐标范围
    ans_assertion: "metrics.get('unique', False) and metrics.get('valid', False) and metrics.get('connectivity', False) and isinstance(star_list, list) and len(star_list) == n and all(isinstance(p, list) and len(p) == 2 and 1 <= p[0] <= n and 1 <= p[1] <= n for p in star_list) and metrics.get('n', 0) == n"

desc: "本题为连通分区的 Star Battle（1 星/行列/区）。规模：{n}x{n}。\\n字母分区网格（每区 4-连通）：\\n{letters_str}\\n请根据规则求解并输出字母顺序对应的星星坐标列表。{q1}"