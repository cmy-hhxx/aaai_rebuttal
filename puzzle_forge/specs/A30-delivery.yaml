custom_operator: 
    countOrders: customs/delivery.py
variables:
  n: 
    type: int
    domain: "[1, 500]"
    diff_factor: 0
symbols: {}
conditions: {}
calc_solution: false
queries:
  q1:
    desc: 计算所有有效的 取货/交付 顺序的数量。若答案非常大，请输出对10^9+7取余的结果。
    ans_formula: countOrders(n)
    ans_text: str(_ans)
    ans_assertion: 'True'
desc: 共有{n}笔快递订单，每笔订单都需要快递服务，都需进行 取货/交付 两个操作，第i笔订单必须满足交付delivery(i)在取货pickup(i)之后进行。快递订单之间没有先后操作顺序要求。{q1}
