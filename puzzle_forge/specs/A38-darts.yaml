custom_operator: 
    numPoints: customs/darts.py
    generate_darts: customs/darts.py
variables:
  n: 
    type: int
    domain: "[1, 100]"
    diff_factor: 1
  r: 
    type: int
    domain: "[1, 500]"
    diff_factor: 1
  upper_bound:
    type: int
    domain: "[1000, 1000]"
    diff_factor: 1
  darts:
    formula: generate_darts(n,upper_bound)
symbols: {}
conditions: {}
calc_solution: false
queries:
  q1:
    desc: 请问，能够落在 任意 半径为 {r} 的圆形靶内或靶上的最大飞镖数。
    ans_formula: numPoints(darts,r)
    ans_text: str(_ans)
    ans_assertion: 'True'
desc: Alice 向一面非常大的墙上掷出 {n} 支飞镖。已知一个数组 darts={str(darts)}，其中 darts[i] = [xi, yi] 表示 Alice 掷出的第 i 支飞镖落在墙上的位置。Bob 知道墙上所有 {n} 支飞镖的位置。他想要往墙上放置一个半径为 {r} 的圆形靶。使 Alice 掷出的飞镖尽可能多地落在靶上。{q1}
