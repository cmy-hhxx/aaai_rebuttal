custom_operator: 
    countDigitOne: customs/numberone.py
variables:
  n: 
    type: int
    domain: "[0, 1000000]"
    diff_factor: 1
symbols: {}
conditions: {}
calc_solution: false
queries:
  q1:
    desc: 计算所有小于等于{n}的非负整数中数字1出现的个数。例如，当n=13时，正确答案为6。
    ans_formula: countDigitOne(n)
    ans_text: str(_ans)
    ans_assertion: 'True'
desc: 给定一个非负整数{n}，{q1}
