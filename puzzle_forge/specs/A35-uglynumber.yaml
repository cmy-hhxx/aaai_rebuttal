custom_operator: 
    nthUglyNumber: customs/uglynumber.py
variables:
  n: 
    type: int
    domain: "[1, 500]"
    diff_factor: 1
  a: 
    type: int
    domain: "[1, 100]"
    diff_factor: 0
  b: 
    type: int
    domain: "[1, 100]"
    diff_factor: 0
  c: 
    type: int
    domain: "[1, 100]"
    diff_factor: 0
symbols: {}
conditions: {}
calc_solution: false
queries:
  q1:
    desc: 按照从小到大的顺序进行排序，请问第 {n} 个丑数为？
    ans_formula: nthUglyNumber(n,a,b,c)
    ans_text: str(_ans)
    ans_assertion: 'True'
desc: 定义丑数是可以被 {a} 或 {b} 或 {c} 整除的正整数。{q1}
