variables:
  n: 
    type: int
    domain: "[1, 10000]"
    diff_factor: 1
  m: 
    type: int
    domain: "[1, 10000]"
    diff_factor: 1
symbols: {}
conditions: {}
calc_solution: false
queries:
  q1:
    desc: 请问有多少种 (x, y) 数目组合满足上述题目描述？
    ans_formula: (m * n) // 2
    ans_text: str(_ans)
    ans_assertion: 'True'
desc: Alice 和 Bob 在一个长满鲜花的环形草地玩一个回合制游戏。环形的草地上有一些鲜花，Alice 到 Bob 之间顺时针有 x 朵鲜花，逆时针有 y 朵鲜花。游戏过程如下：1、Alice 先行动。2、每一次行动中，当前玩家必须选择顺时针或者逆时针，然后在这个方向上摘一朵鲜花。3、一次行动结束后，如果所有鲜花都被摘完了，那么 当前 玩家抓住对手并赢得游戏的胜利。已知按照上述规则，Alice 赢得了该游戏。Alice 顺时针方向上的鲜花数目 x 必须在区间 [1,{n}] 之间，且Alice 逆时针方向上的鲜花数目 y 必须在区间 [1,{m}] 之间。{q1}
