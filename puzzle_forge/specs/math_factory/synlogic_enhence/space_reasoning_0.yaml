custom_operator:
  function_1: space_reasoning_0.py
  function_2: space_reasoning_0.py
  function_3: space_reasoning_0.py

calc_solution: false

variables:
  R:
    type: int
    domain: "[3, 7]"
    diff_factor: 2
  directions:
    formula: "['NE','E','SE','SW','W','NW']"
    diff_factor: 0

  scenario:
    formula: function_2(R)
    diff_factor: 5

  start_label:
    formula: "scenario['start_label']"
    diff_factor: 0
  start_category:
    formula: "scenario['start_category']"
    diff_factor: 0

  record_dirs:
    formula: "scenario['record']['dirs']"
    diff_factor: 0
  record_steps:
    formula: "scenario['record']['steps']"
    diff_factor: 0
  record_labels:
    formula: "scenario['record']['labels']"
    diff_factor: 0
  record_categories:
    formula: "scenario['record']['categories']"
    diff_factor: 0
  record_text:
    formula: "scenario['record']['text']"
    diff_factor: 0

  final_dirs:
    formula: "scenario['final']['dirs']"
    diff_factor: 0
  final_steps:
    formula: "scenario['final']['steps']"
    diff_factor: 0
  final_text:
    formula: "scenario['final']['text']"
    diff_factor: 0

  rule_text:
    formula: "scenario['rule_text']"
    diff_factor: 0
  env_text:
    formula: "scenario['env_text']"
    diff_factor: 0
  state_text:
    formula: "scenario['state_text']"
    diff_factor: 0

queries:
  q1:
    desc: '问题：从当前位置执行序列（遵循上文随机生成的规则系统）：{final_text}。请写出最终看到的设备标签；若无法到达有效顶点或无设备则写unknown。答案格式：直接填写设备标签（含坐标），例如 声纳设备12@(1,-3)。'
    ans_formula: "function_1(scenario)"
    ans_text: "str(_ans)"
    ans_assertion: "function_3(scenario, _ans)"

desc: '海底研究站六方向蜂巢网络（高阶复合规则版）：同心六边形蜂巢网络，共{R}圈（第1圈为中心1个六边形，圈k由6k个六边形组成），沿顶点移动，方向使用[NE, E, SE, SW, W, NW]，步数指跨越边的数量。坐标与方向：采用轴坐标(q,r)，六方向的坐标变化为E:(+1,0)、SE:(0,+1)、SW:(-1,+1)、W:(-1,0)、NW:(0,-1)、NE:(+1,-1)；外圈定义为max(|q|,|r|,|q+r|)=R，角点为[(R,0),(0,R),(-R,R),(-R,0),(0,-R),(R,-R)]。规则说明：{rule_text} 全图特殊点统计：{env_text}。行走记录：起点为{start_label}({start_category})，{record_text}；状态快照：{state_text}；请按问题部分的最终序列执行并给出最终设备。注意：答案格式为设备标签文本（包含坐标），例如 声纳设备12@(1,-3)。\n{q1}'