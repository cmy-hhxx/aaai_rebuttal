custom_operator:
  # 造题与求解辅助函数均在 wordscapes_3.py 中定义，名称需一一对应
  generate_instance: wordscapes_3.py
  generate_fill: wordscapes_3.py
  normalize_grid: wordscapes_3.py
  grid_to_string: wordscapes_3.py
  mask_to_string: wordscapes_3.py
  locks_to_text: wordscapes_3.py
  rules_to_text: wordscapes_3.py
  words_to_brackets: wordscapes_3.py
  grid_to_json: wordscapes_3.py
  validate_solution: wordscapes_3.py

# ------------------------
# 随机变量（遵循不前向引用）
# ------------------------
variables:
  grid_size:
    type: int
    domain: '[7, 9]'
  target_word_len:
    type: int
    domain: '[5, 6]'
  n_across:
    type: int
    domain: '[2, 3]'
  n_down:
    type: int
    domain: '[2, 3]'
  across_rows_count:
    type: int
    domain: '[2, 3]'
  down_cols_count:
    type: int
    domain: '[2, 3]'
  locks_budget:
    type: int
    domain: '[0, 3]'
  attempt_limit:
    type: int
    domain: '[150, 300]'
  vc_rule_count:
    type: int
    domain: '[2, 3]'
  row_rule_count:
    type: int
    domain: '[0, 2]'
  col_rule_count:
    type: int
    domain: '[0, 2]'
  parity_rule_count:
    type: int
    domain: '[1, 2]'
  distinct_rows_flag:
    type: int
    domain: '[0, 1]'
  distinct_cols_flag:
    type: int
    domain: '[0, 1]'
  compare_rule_flag:
    type: int
    domain: '[0, 1]'
  anchor_equal_flag:
    type: int
    domain: '[0, 1]'
  global_letter_rule_flag:
    type: int
    domain: '[0, 1]'

  # 调用外部生成器，返回实例字典（内部强制使用确定性回溯验证唯一解）
  instance:
    formula: 'generate_instance(grid_size, target_word_len, n_across, n_down, across_rows_count, down_cols_count, locks_budget, attempt_limit, vc_rule_count, row_rule_count, col_rule_count, parity_rule_count, distinct_rows_flag, distinct_cols_flag, compare_rule_flag, anchor_equal_flag, global_letter_rule_flag)'

  # 从实例中展开参数
  final_grid_size:
    formula: "instance['grid_size']"
  word_len:
    formula: "instance['word_len']"
  across_words:
    formula: "instance['across_words']"
  down_words:
    formula: "instance['down_words']"
  grid_mask:
    formula: "instance['grid_mask']"
  locks:
    formula: "instance['locks']"
  rules:
    formula: "instance['rules']"

  # 文本化（带行列编号的掩码，便于坐标对齐）
  mask_ascii:
    formula: 'mask_to_string(grid_mask)'
  locks_desc:
    formula: 'locks_to_text(locks)'
  rules_desc:
    formula: 'rules_to_text(rules)'
  across_desc:
    formula: 'words_to_brackets(across_words)'
  down_desc:
    formula: 'words_to_brackets(down_words)'

# 直接计算模式（不启用Z3）
calc_solution: false

queries:
  q1:
    desc: '请在下方给定的网格掩码中填入所有单词，满足：1) 每个给定的Across单词各使用一次且只能横向放置（左→右）；2) 每个给定的Down单词各使用一次且只能纵向放置（上→下）；3) 横纵单词可以交叉，但交叉处字母必须一致；4) “锁定字母”（坐标为1-based，且均位于某个长度恰为 {word_len} 的 Across/Down 段内）必须满足；5) 所有掩码中的''X''在最终输出中必须保持为''X''；6) 未被任何单词覆盖的可填格保持空白（单空格）；7) 同一方向的单词在任一格上不得重叠。答案格式：仅输出最终填字后的标准JSON二维字符数组（必须使用双引号），每个元素为单字符——阻塞格为''X''（大写X）、未被任何单词覆盖的可填格为'' ''（单空格）、覆盖到的格为对应小写字母（a-z）。仅允许的字符集合为：''X''、'' ''、''a''..''z''；请勿输出除网格二维数组以外的任何字符。示例（演示用单引号，实际提交需用双引号）：[[''X'','' '',''X''],[''a'',''b'',''c''],[''X'',''d'',''X'']].'
    ans_formula: 'generate_fill(across_words, down_words, grid_mask, locks, rules)'
    ans_text: 'grid_to_json(_ans)'
    ans_assertion: 'validate_solution(_ans, grid_mask, across_words, down_words, locks, rules, word_len)'

desc: '在一个 {final_grid_size}×{final_grid_size} 的网格中，掩码以多行字符串给出：每行由字符''X''（阻塞）与''0''（可填）构成。你需要将 Across 单词（横向，左→右）{across_desc} 与 Down 单词（纵向，上→下）{down_desc} 放入任意长度恰为 {word_len} 的连续可填段中，并满足：1) 每个给定单词必须且仅使用一次；2) Across 只能横放、Down 只能竖放；3) 横纵单词可以交叉但交叉处字母必须一致；4) 锁定字母（坐标为1-based，且均位于某个长度恰为 {word_len} 的 Across/Down 段内）必须满足：{locks_desc}；5) 所有“额外规则”均为强约束：{rules_desc}；其中“最左侧Across单词”按起始列最小、若并列取起始行最小；“最上方Down单词”按起始行最小、若并列取起始列最小；计数类规则均仅统计字母格（忽略空格与X）。6) 所有掩码中的''X''在最终输出中必须保持为''X''；7) 同一方向的单词不得重叠；8) 未被任何单词覆盖的可填格保持空白（单空格）。\n掩码如下（含行列编号）：\n{mask_ascii}\n请严格按答案格式输出最终网格（标准JSON二维字符数组，必须使用双引号）；字符集合仅限于''X''、'' ''与小写字母（a-z）。示例（演示用单引号，实际提交需用双引号）：[[''X'','' '',''X''],[''a'',''b'',''c''],[''X'',''d'',''X'']]。\n{q1}'