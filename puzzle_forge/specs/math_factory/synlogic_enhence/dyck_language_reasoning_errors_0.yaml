custom_operator:
  function_1: dyck_language_reasoning_errors_0.py
  function_2: dyck_language_reasoning_errors_0.py
  gen_dyck_random: dyck_language_reasoning_errors_0.py
  build_thought_lines_ex: dyck_language_reasoning_errors_0.py
  build_rule_texts: dyck_language_reasoning_errors_0.py
  verify_unique_answer: dyck_language_reasoning_errors_0.py

variables:
  # 选用的括号类型数量
  include_types_num:
    type: int
    domain: "[2, 4]"

  # 输入序列总长度（字符数）
  seq_len:
    type: int
    domain: "[20, 60]"

  # 最大允许嵌套深度（多段共享上限）
  max_nesting:
    type: int
    domain: "[2, 8]"

  # 段数（提升结构隐蔽性与复杂度）
  segment_num:
    type: int
    domain: "[2, 5]"

  # 生成平衡序列的概率（越高越可能完全符合Dyck）
  balanced_prob:
    type: float
    domain: "[0.5, 1.0]"

  # 注入思考过程错误的数量
  error_count:
    type: int
    domain: "[0, 6]"

  # 错误风格的数量（控制不同腐蚀样式叠加）
  error_styles_num:
    type: int
    domain: "[1, 3]"

  # 最终声明的栈状态变体: 'empty' 或 'nonempty'
  final_claim_variant:
    type: enum
    domain: "['empty', 'nonempty']"

  # 规则复杂度等级（控制生成的规则句数与覆盖面）
  rule_complexity_level:
    type: int
    domain: "[3, 5]"

  # 随机生成输入序列（分段+嵌套+腐蚀）
  input_seq:
    formula: "gen_dyck_random(seq_len, include_types_num, max_nesting, balanced_prob, segment_num)"

  # 基于输入序列生成思考过程, 按错误风格混合注入指定数量错误, 控制最终声明变体
  thought_lines:
    formula: "build_thought_lines_ex(input_seq, error_count, final_claim_variant, error_styles_num)"

  # 规则文本的随机生成（解释术语与流程, 强化推理线索）
  rule_texts:
    formula: "build_rule_texts(input_seq, final_claim_variant, rule_complexity_level)"

  # 展示用的拼接文本
  joined_thoughts:
    formula: "'\\n'.join(thought_lines)"
  rules_joined:
    formula: "'\\n'.join(rule_texts)"

  # 自动检测错误步骤编号（升序）
  error_steps:
    formula: "function_1(input_seq, thought_lines)"

  # 答案格式化（无错空串，有错为逗号分隔编号）
  answer_text:
    formula: "function_2(error_steps)"

  # 唯一解验证（高效判定，无歧义）
  is_unique:
    formula: "verify_unique_answer(input_seq, thought_lines, answer_text)"

calc_solution: false

queries:
  q1:
    desc: '请根据下述规则与Dyck语言约定检查括号匹配推理是否正确。\n规则说明:\n{rules_joined}\n输入序列为: {input_seq}\n给定的思考过程如下:\n{joined_thoughts}\n答案格式: 若无错误请输出空串; 若有多个错误, 请按示例输出: 1,3,9。\n问题: 这个序列中有推理错误吗? 请按指定格式输出错误步骤编号(对应思考过程N)。'
    ans_formula: answer_text
    ans_text: 'answer_text'
    ans_assertion: 'is_unique'

desc: '本题随机生成括号序列与规则文本, 并构造逐步的栈状态思考过程, 需要你找出思考过程中的错误步骤编号。请严格按答案格式输出: 无错输出空串, 多错用英文逗号分隔, 例如 1,3,9。\n{q1}'