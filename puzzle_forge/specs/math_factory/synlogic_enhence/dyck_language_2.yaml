# ================================
# 自定义操作符：引入 Python 实现
# ================================
custom_operator:
  choose_bracket_pairs: dyck_language_2.py
  choose_cost_mode: dyck_language_2.py
  sample_cost_map: dyck_language_2.py
  format_cost_desc: dyck_language_2.py
  format_pairs_desc: dyck_language_2.py
  choose_prefix_strategy: dyck_language_2.py
  generate_prefix: dyck_language_2.py
  get_prefix_len: dyck_language_2.py
  choose_depth_cost_mode: dyck_language_2.py
  sample_depth_costs: dyck_language_2.py
  format_depth_cost_desc: dyck_language_2.py
  compute_min_cost_lex: dyck_language_2.py
  verify_answer: dyck_language_2.py

# ================================
# 变量定义：多层成本与前缀控制
# ================================
variables:
  # 使用的括号种类数
  type_count:
    type: int
    domain: "[2, 4]"
  # 前缀最小长度
  min_len:
    type: int
    domain: "[8, 18]"
  # 前缀最大长度
  max_len:
    type: int
    domain: "[min_len + 4, min_len + 12]"
  # 强制出现至少一次非栈顶匹配（保证非平凡）
  ensure_mismatch:
    formula: 'True'
  # 右括号基础成本区间与模式
  cost_low:
    type: int
    domain: "[1, 5]"
  cost_high:
    type: int
    domain: "[cost_low + 3, cost_low + 9]"
  cost_mode:
    formula: choose_cost_mode()
  # 随机选择的括号对映射 open->close（右括号字符两两不同）
  open_to_close:
    formula: choose_bracket_pairs(type_count)
  # 右括号基础成本映射
  right_costs:
    formula: sample_cost_map(open_to_close, cost_low, cost_high, cost_mode)
  cost_desc:
    formula: format_cost_desc(right_costs)
  # 允许的括号对描述
  pairs_desc:
    formula: format_pairs_desc(open_to_close)
  # 前缀生成策略
  prefix_strategy:
    formula: choose_prefix_strategy()
  # 生成的可修复前缀（保证至少一次非栈顶匹配）
  prefix:
    formula: generate_prefix(open_to_close, min_len, max_len, ensure_mismatch, prefix_strategy)
  # 前缀长度（用于难度评估）
  prefix_len:
    formula: get_prefix_len(prefix)
    diff_factor: 1

  # 深度加价层数与区间、模式
  depth_levels:
    type: int
    domain: "[3, 6]"
  depth_low:
    type: int
    domain: "[0, 2]"
  depth_high:
    type: int
    domain: "[depth_low + 1, depth_low + 4]"
  depth_mode:
    formula: choose_depth_cost_mode()
  depth_costs:
    formula: sample_depth_costs(depth_levels, depth_low, depth_high, depth_mode)
  depth_cost_desc:
    formula: format_depth_cost_desc(depth_costs)

  # 非栈顶匹配加价与切换加价
  mismatch_surcharge:
    type: int
    domain: "[0, 3]"
  switch_penalty:
    type: int
    domain: "[0, 2]"

# ================================
# 求解模式：纯计算（不使用 Z3）
# ================================
calc_solution: false

# ================================
# 问题与答案
# ================================
queries:
  q1:
    # 小问：仅保留答案格式提示，避免与题面重复
    desc: '请给出最小总成本与完整平衡序列。答案格式为 cost=<最小总成本>, seq=<完整平衡序列>，例如 cost=7, seq=()[]'
    # 计算唯一标准答案
    ans_formula: 'compute_min_cost_lex(prefix, open_to_close, right_costs, depth_costs, mismatch_surcharge, switch_penalty)'
    # 固定答案文本格式
    ans_text: "'cost=' + str(_ans[0]) + ', seq=' + _ans[1]"
    # 严格校验：答案必须与参考算法一致且唯一且平衡
    ans_assertion: 'verify_answer(prefix, open_to_close, right_costs, depth_costs, mismatch_surcharge, switch_penalty, _ans[0], _ans[1])'

# ================================
# 题面描述（仅包含解题必要信息）
# ================================
desc: '给定前缀为：{prefix}。允许的括号对为：{pairs_desc}。右括号基础成本为：{cost_desc}。深度加价规则为：{depth_cost_desc}，按插入当刻的栈深计算，若当前深度超过上述最大层则按最后一层取值。计费规则分为四部分：一，基础成本按所插入的右括号字符计；二，深度加价按插入时的栈深叠加；三，当遇到前缀中的右括号需要向下匹配时，必须先依次插入右括号以弹出到该开括号之上的所有开括号，此类每次插入额外加价为 {mismatch_surcharge}；四，若连续两次插入的右括号字符不同，则切换加价为 {switch_penalty}。前缀自带的字符不产生任何成本，且不参与切换判定。插入过程需始终保持合法，即每次插入的右括号必须与当时的栈顶开括号匹配。所有允许的括号对的右括号字符两两不同。为使序列最终平衡而关闭末尾残余开括号不属于非栈顶匹配加价场景，但切换加价仍适用。你只能插入右括号使整个序列平衡并使总成本最小；若存在多个最优补全，则在所有最小成本的完整平衡序列中按字典序最小者为答案，字典序按字符的Unicode码点递增顺序逐字符比较。答案格式为 cost=<最小总成本>, seq=<完整平衡序列>，其中 seq 仅由括号字符组成，例如 cost=7, seq=()[]\n{q1}'