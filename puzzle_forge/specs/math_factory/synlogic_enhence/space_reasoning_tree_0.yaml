# ================================================
# 高阶泛化版：多层次堂兄弟定义 + 复合过滤器 + 隐式辅助变量 + 唯一解保证
# 生成模式：正向生成（随机输入 -> 复合逻辑推理 -> 唯一解答案）
# 说明：
# - 随机生成城市树与建筑属性，并随机定义多层次‘堂兄弟’关系与复合过滤条件。
# - 使用 function_2 构造输入与文本并保证唯一解；使用 function_1 计算答案。
# - 不使用 SMT（calc_solution: false），答案由 Python 逻辑确定。
# - 单行题面，单引号，无双引号；集合展示用 []。
# ================================================
custom_operator:
  function_1: space_reasoning_tree_0.py
  function_2: space_reasoning_tree_0.py

variables:
  # -------------------------
  # 规模参数（全面随机化）
  # -------------------------
  region_num:
    type: int
    domain: "[2, 4]"  # 大区数量：2~4
  district_min:
    type: int
    domain: "[1, 3]"  # 每大区的区数下限：1~3
  district_max:
    formula: "district_min + randint(0, 3)"  # 上限：下限+0~3
  block_min:
    type: int
    domain: "[1, 3]"  # 每区的街区数下限：1~3
  block_max:
    formula: "block_min + randint(0, 3)"     # 上限：下限+0~3
  building_min:
    type: int
    domain: "[1, 3]"  # 每街区的建筑数下限：1~3
  building_max:
    formula: "building_min + randint(1, 3)"  # 上限：下限+1~3

  # -------------------------
  # 名称与等级参数（随机）
  # -------------------------
  city_name:
    formula: "get_faker(1, 'city', 'zh_CN')[0]"  # 中文城市名
  grade_choices:
    formula: "['A', 'B']"  # 等级集合
  a_prob:
    formula: "(randint(4, 9)) / 10"  # A 等级概率：0.4~0.9

  # -------------------------
  # 建筑隐式属性范围（随机）
  # -------------------------
  eco_min:
    type: int
    domain: "[5, 15]"
  eco_max:
    formula: "eco_min + randint(5, 15)"
  noise_min:
    type: int
    domain: "[5, 15]"
  noise_max:
    formula: "noise_min + randint(5, 15)"
  height_min:
    type: int
    domain: "[10, 40]"
  height_max:
    formula: "height_min + randint(10, 40)"
  occup_min:
    type: int
    domain: "[50, 150]"
  occup_max:
    formula: "occup_min + randint(50, 200)"

  # -------------------------
  # 唯一解搜索限制（高效性保障）
  # -------------------------
  max_search_seconds:
    type: int
    domain: "[2, 2]"  # 默认 2 秒墙钟限制，确保远低于 3 分钟
  max_attempts:
    type: int
    domain: "[200, 500]"

  # -------------------------
  # 生成整棵城市树、属性、规则与文本，并保证唯一解
  # 返回字典包含：
  # - city, regions, districts_by_region, blocks_by_district, buildings_by_block
  # - grade_by_building, features_by_building
  # - target_building（参照建筑）
  # - cousin_def（share_levels, not_share_levels）
  # - filters_machine（过滤条件列表），filter_agg（聚合器字典）
  # - overview_text（结构概述），attributes_text（属性概述）
  # - rule_text（堂兄弟定义文本），filter_text（过滤条件文本），filter_agg_text（聚合逻辑文本）
  # - unique_ok（唯一解是否达成）
  # -------------------------
  gen:
    formula: "function_2(city_name, region_num, district_min, district_max, block_min, block_max, building_min, building_max, grade_choices, a_prob, [eco_min, eco_max], [noise_min, noise_max], [height_min, height_max], [occup_min, occup_max], max_search_seconds, max_attempts)"

  # -------------------------
  # 提取生成结果中的具体结构、规则与文本
  # -------------------------
  city:
    formula: "gen['city']"
  regions:
    formula: "gen['regions']"
  districts_by_region:
    formula: "gen['districts_by_region']"
  blocks_by_district:
    formula: "gen['blocks_by_district']"
  buildings_by_block:
    formula: "gen['buildings_by_block']"
  grade_by_building:
    formula: "gen['grade_by_building']"
  features_by_building:
    formula: "gen['features_by_building']"
  target_building:
    formula: "gen['target_building']"
  cousin_def:
    formula: "gen['cousin_def']"
  filters_machine:
    formula: "gen['filters_machine']"
  filter_agg:
    formula: "gen['filter_agg']"
  overview_text:
    formula: "gen['overview_text']"
  attributes_text:
    formula: "gen['attributes_text']"
  rule_text:
    formula: "gen['rule_text']"
  filter_text:
    formula: "gen['filter_text']"
  filter_agg_text:
    formula: "gen['filter_agg_text']"
  unique_ok:
    formula: "gen['unique_ok']"

# 不使用 SMT 求解
calc_solution: false

queries:
  q1:
    desc: '请回答：在当前城市结构下，以参照建筑{target_building}为基准，堂兄弟关系定义为{rule_text}。设定过滤逻辑为{filter_agg_text}，过滤条件列表为[{filter_text}]。所有建筑的环保等级与隐式属性详见结构与属性概述。答案格式：请输出唯一满足条件的建筑名称；若没有唯一解或无法确定，请输出unknown。'
    ans_formula: "function_1(city, target_building, buildings_by_block, grade_by_building, blocks_by_district, districts_by_region, features_by_building, cousin_def, filters_machine, filter_agg)"
    ans_text: "_ans"
    # 唯一解验证（高效生成已在 function_2 完成，这里做最终断言）
    ans_assertion: "unique_ok and _ans != 'unknown' and len(_ans.split(',')) == 1"

# 题面描述：单行、单引号、不使用花括号展示集合；包含完整结构、属性与规则说明以及答案格式提示
desc: '层级为城市—大区—区—街区—建筑；堂兄弟指在某些高层级相同但在若干低层级不同的节点（本题将具体说明）。当前城市为{city}；结构概述：{overview_text}；属性概述：{attributes_text}；堂兄弟定义：{rule_text}；过滤逻辑：{filter_agg_text}；过滤条件列表：[{filter_text}]；请按答案格式输出结果：唯一建筑名称，若无法唯一确定则输出unknown。{q1}'