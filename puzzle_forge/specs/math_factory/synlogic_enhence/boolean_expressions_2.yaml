# ================================================================
# 自定义算子：引用同名外部 python 文件 boolean_expressions_2.py 提供辅助函数
# ================================================================
custom_operator:
  is_leap: boolean_expressions_2.py
  is_prime: boolean_expressions_2.py
  is_even: boolean_expressions_2.py
  gcd: boolean_expressions_2.py
  is_coprime: boolean_expressions_2.py
  eval_statements: boolean_expressions_2.py
  format_answer: boolean_expressions_2.py
  generate_valid_pack: boolean_expressions_2.py
  verify_unique_truthset: boolean_expressions_2.py
  verify_output_possible: boolean_expressions_2.py
  compute_code: boolean_expressions_2.py
  combined_answer: boolean_expressions_2.py

# ================================================================
# 变量定义：元参数与取值范围，至少一个变量带有 diff_factor
# ================================================================
variables:
  year_low:
    type: int
    domain: "[1500, 2100]"
  year_high:
    type: int
    domain: "[year_low + 200, year_low + 500]"

  m_low:
    type: int
    domain: "[2, 12]"
  m_high:
    type: int
    domain: "[m_low + 20, m_low + 120]"
  n_low:
    type: int
    domain: "[2, 12]"
    diff_factor: 1
  n_high:
    type: int
    domain: "[n_low + 20, n_low + 120]"

  diff_mode:
    type: int
    domain: "[0, 2]"
    diff_factor: 1

  pack:
    formula: generate_valid_pack(year_low, year_high, m_low, m_high, n_low, n_high, diff_mode)

  y1:
    formula: pack[0]
  y2:
    formula: pack[1]
  m:
    formula: pack[2]
  n:
    formula: pack[3]

# ================================================================
# 本题为直接计算模式：不进行 Z3 求解
# ================================================================
calc_solution: false

# ================================================================
# 问题定义：统一输出单一答案字符串
# ================================================================
queries:
  q:
    desc: '只需输出一个最终答案字符串，格式为 左侧固定字符串====右侧整数。左侧为所有为真的命题字母按字母顺序用逗号加空格分隔组成的固定字符串；示例：A, B, E, F====123。右侧为安全码整数，其计算规则如下：字母位置值 A 为1、B 为2、…、F 为6；令 base 为所有为真命题的字母位置值之和；安全码等于 base 加上 gcd(y1, y2)，再加上 m 与 n 的乘积对 97 取模的值；若 y1 与 y2 之和为偶数则再加1，否则加0；若 m 与 n 互素则加0，否则加3。'
    ans_formula: combined_answer(y1, y2, m, n)
    ans_text: 'str(_ans)'
    ans_assertion: 'verify_unique_truthset(y1, y2, m, n) and verify_output_possible(y1, y2, m, n)'

# ================================================================
# 整体描述：题面与问题展示；desc 使用单引号，内部不使用英文引号；换行用 \n
# ================================================================
desc: '设 y1={y1}, y2={y2}；m={m}, n={n}。数值均为正整数且 y2 大于 0；除法比较按实数意义进行。\n定义说明：闰年指能被4整除且不能被100整除，或能被400整除；质数指不小于2且仅能被1和自身整除；偶数指能被2整除的整数；互素指两数的最大公因数为1；平方数指存在整数 t 使 t*t 等于该数；异或指两个条件中恰有一个为真；最大公因数记作 gcd(a, b)。\n全局约束（所有命题的真值必须同时满足）：在命题 A 到 D 中恰有两条为真；在命题 E 与 F 中至少有一条为真；若 D 为真则 B 必为假；若 C 为真则 A 或 E 至少一条为真。\n请判断下列命题的真值，并输出一个最终答案字符串，格式为 左侧固定字符串====右侧整数：\n- A. （y1 为闰年）且（m*n 为偶数）\n- B. 非（y2 为闰年 或 （n - m*m 大于 -10））\n- C. （y2 不是闰年 且 m 为质数 且 n 为偶数）\n- D. （m + n 为偶数 且 （y1 / y2 大于 1））\n- E. （m 与 n 互素 且 y1 能被 m + n 整除）或（y1 + y2 为偶数 且 |m - n| 不超过 2）\n- F. （y1 与 y2 互素 且 m + n 为平方数）或（非（m 能被3整除 与 n 能被3整除 进行异或））\n左侧固定字符串为所有为真的命题字母按字母顺序用逗号加空格分隔输出；示例：A, B, E, F====123。右侧为安全码整数，计算规则如下：字母位置值 A 为1、B 为2、…、F 为6；令 base 为所有为真命题的字母位置值之和；安全码等于 base 加上 gcd(y1, y2)，再加上 m 与 n 的乘积对 97 取模的值；若 y1 与 y2 之和为偶数则再加1，否则加0；若 m 与 n 互素则加0，否则加3。只需输出一个最终答案字符串，例如 A, B, E, F====123。\n{q}'