# ============================
# 自定义操作符：引用外部Python函数
# ============================
custom_operator:
  gen_incomplete_seq: dyck_language_0.py
  complete_brackets: dyck_language_0.py
  is_balanced: dyck_language_0.py
  seq_length: dyck_language_0.py
  unmatched_count: dyck_language_0.py
  pick_bracket_types: dyck_language_0.py
  rand_float: dyck_language_0.py
  types_human_readable: dyck_language_0.py
  has_prefix: dyck_language_0.py
  pick_types_list: dyck_language_0.py
  rand_int_list: dyck_language_0.py
  rand_float_list: dyck_language_0.py
  gen_many_incomplete: dyck_language_0.py
  complete_many: dyck_language_0.py
  needed_closers_list: dyck_language_0.py
  validate_completion_batch: dyck_language_0.py
  join_with_sep: dyck_language_0.py
  join_int_list: dyck_language_0.py
  types_human_list: dyck_language_0.py
  join_types_for_desc: dyck_language_0.py
  list_len_int: dyck_language_0.py
  appended_suffixes_list: dyck_language_0.py
  total_appended_counts: dyck_language_0.py
  sum_of_squares: dyck_language_0.py
  verify_suffixes: dyck_language_0.py
  check_counts_csv: dyck_language_0.py
  verify_uniqueness: dyck_language_0.py
  all_unmatched_positive: dyck_language_0.py
  suffix_lengths_equal: dyck_language_0.py
  to_str: dyck_language_0.py
  check_final_pack: dyck_language_0.py

# ============================
# 变量定义：增强随机性与多样性
# ============================
variables:
  # 段数（任务规模），越多越难
  seq_num:
    type: int
    domain: "[3, 6]"
    diff_factor: 1

  # 允许的括号类型数量范围（每段独立随机）
  min_types:
    type: int
    domain: "[2, 3]"
    diff_factor: 1
  max_types:
    type: int
    domain: "[min_types, 4]"
    diff_factor: 0

  # 每段骨架目标长度（越大越难）
  base_lens:
    formula: "rand_int_list(seq_num, 18, 64)"
    diff_factor: 1

  # 噪声概率上界与每段的实际噪声概率（越大越难）
  noise_max:
    type: float
    domain: "[0.0, 0.4]"
    diff_factor: 1
  noise_probs:
    formula: "rand_float_list(seq_num, 0.0, noise_max)"
    diff_factor: 1

  # 每段至少保留的未匹配开括号数量（越大越难）
  min_unmatched_list:
    formula: "rand_int_list(seq_num, 1, 4)"
    diff_factor: 1

  # 每段的允许括号类型集合列表（安全文本，内部已将花括号转义为 {{}}）
  allowed_types_list:
    formula: "pick_types_list(seq_num, min_types, max_types)"
    diff_factor: 0

  # 批量生成的合法括号前缀（Dyck 前缀，含可忽略噪声）
  given_seqs:
    formula: "gen_many_incomplete(base_lens, allowed_types_list, noise_probs, min_unmatched_list)"
    diff_factor: 0

  # 人类可读的每段括号类型描述及拼接文本
  types_texts:
    formula: "types_human_list(allowed_types_list)"
    diff_factor: 0
  types_text_joined:
    formula: "join_types_for_desc(types_texts)"
    diff_factor: 0

  # 统计与派生
  needed_counts:
    formula: "needed_closers_list(given_seqs)"
    diff_factor: 1
  completed_list:
    formula: "complete_many(given_seqs)"
    diff_factor: 0
  given_text:
    formula: "join_with_sep(given_seqs, '|')"
    diff_factor: 0

  # 仅追加的后缀与全局计数
  suffix_list:
    formula: "appended_suffixes_list(given_seqs)"
    diff_factor: 0
  suffix_joined:
    formula: "join_with_sep(suffix_list, '|')"
    diff_factor: 0
  total_counts_list:
    formula: "total_appended_counts(given_seqs)"
    diff_factor: 0
  total_counts_csv:
    formula: "join_int_list(total_counts_list, ',')"
    diff_factor: 0

  # 校验用全局难度指标
  sumsq_needed:
    formula: "sum_of_squares(needed_counts)"
    diff_factor: 1

# ============================
# 直接计算模式：无需Z3求解
# ============================
calc_solution: false

# ============================
# 问题与答案（五问 + 汇总）
# ============================
queries:
  # 第1问：输出补全后的完整序列（竖线分隔）
  q1:
    desc: '第一问 将每段序列补全为平衡括号串 只允许在每段末尾追加最少数量的右括号 保持原有字符顺序不变 输出所有段的完整补全结果 用竖线分隔 不含空格 示例 ()[]|<>'
    ans_formula: join_with_sep(completed_list, '|')
    ans_text: str(_ans)
    ans_assertion: 'validate_completion_batch(given_seqs, completed_list) and verify_uniqueness(given_seqs)'

  # 第2问：输出每段需要追加的右括号数量（逗号分隔）
  q2:
    desc: '第二问 输出每段需要追加的右括号数量 用逗号分隔 不含空格 顺序与题目段顺序一致 示例 2,3,1'
    ans_formula: join_int_list(needed_counts, ',')
    ans_text: str(_ans)
    ans_assertion: 'list_len_int(needed_counts) == seq_num and verify_uniqueness(given_seqs) and suffix_lengths_equal(needed_counts, suffix_list)'

  # 第3问：仅输出每段实际追加的右括号后缀（竖线分隔）
  q3:
    desc: '第三问 对每段只输出实际追加的右括号后缀 不包含原有字符 用竖线分隔 不含空格 示例 )]|>'
    ans_formula: suffix_joined
    ans_text: str(_ans)
    ans_assertion: 'verify_suffixes(given_seqs, suffix_list) and all_unmatched_positive(given_seqs)'

  # 第4问：输出按顺序 ) ] } > 的全局追加总数列表（逗号分隔）
  q4:
    desc: '第四问 统计所有段追加的右括号总数 输出顺序依次为 ) ] }} > 共四个整数 用逗号分隔 不含空格 示例 3,2,0,5'
    ans_formula: total_counts_csv
    ans_text: str(_ans)
    ans_assertion: 'check_counts_csv(given_seqs, _ans)'

  # 第5问：输出每段追加数的平方和
  q5:
    desc: '第五问 将第二问得到的每段追加数量分别平方后求和 输出一个整数 示例 9'
    ans_formula: sumsq_needed
    ans_text: str(_ans)
    ans_assertion: 'sum_of_squares(needed_counts) == int(_ans)'

  # 第6问：最终汇总答案（一次性评测友好）
  q6:
    desc: '第六问 请将前五问的答案按如下格式汇总输出 一个不含空格的字符串\n格式 第一问答案====第二问答案====第三问答案====第四问答案====第五问答案\n示例 ()[]|<>====2,3,1====)]|>====3,2,0,5====9'
    ans_formula: join_with_sep(completed_list, '|') + '====' + join_int_list(needed_counts, ',') + '====' + suffix_joined + '====' + total_counts_csv + '====' + to_str(sumsq_needed)
    ans_text: str(_ans)
    ans_assertion: 'check_final_pack(given_seqs, _ans)'

# ============================
# 题面描述
# ============================
desc: '本题需要你补全若干段括号序列以使其全部括号闭合 序列中如包含非括号字符则按原样保留并在匹配时忽略 只允许在每段序列末尾追加右括号且必须是最少数量 并保证每段至少追加一个右括号 本题共有 {seq_num} 段 每一段的可用括号类型分别为 {types_text_joined} 给定的原始序列按顺序为 {given_text} 你需要依次回答以下问题 并严格按照指定输出格式作答 方便自动判分\n一 答案格式 每小问答案均为纯字符串 不含多余空格 分隔符严格按题面要求\n1 第一问 输出补全后的各段完整序列 用竖线分隔 示例 ()[]|<>\n2 第二问 输出每段需要追加的右括号数量 用逗号分隔 示例 2,3,1\n3 第三问 输出每段实际追加的右括号后缀 用竖线分隔 示例 )]|>\n4 第四问 统计全局追加右括号总数 输出顺序依次为 ) ] }} > 共四个整数 用逗号分隔 示例 3,2,0,5\n5 第五问 将第二问各段追加数平方后求和 输出一个整数 示例 9\n6 第六问 将前五问答案按 第一问答案====第二问答案====第三问答案====第四问答案====第五问答案 的格式汇总为一个字符串 示例 ()[]|<>====2,3,1====)]|>====3,2,0,5====9\n请注意 噪声字符将被保留但不参与括号匹配 只能在每段末尾追加最少数量的右括号 且每段至少追加一个右括号\n问题如下\n{q1}\n{q2}\n{q3}\n{q4}\n{q5}\n{q6}\n'