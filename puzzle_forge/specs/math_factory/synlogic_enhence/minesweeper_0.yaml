custom_operator:
  function_1: minesweeper_0.py
  function_2: minesweeper_0.py

variables:
  rows:
    type: int
    domain: "[4, 9]"
  cols:
    type: int
    domain: "[5, 10]"
  neighbor_mode:
    type: enum
    domain: "['even_r', 'odd_r']"
  inf_prob:
    type: float
    domain: "[0.06, 0.38]"
  mask_safe_prob:
    type: float
    domain: "[0.35, 0.95]"

  rule_min:
    type: int
    domain: "[3, 6]"
  rule_max:
    type: int
    domain: "[6, 12]"
  use_neighbor_rules:
    type: bool
    domain: "[True, False]"
  use_group_rules:
    type: bool
    domain: "[True, False]"

  w_neighbor_eq:
    type: float
    domain: "[0.0, 1.0]"
  w_neighbor_zero:
    type: float
    domain: "[0.0, 1.0]"
  w_group_eq:
    type: float
    domain: "[0.0, 1.0]"
  w_group_atleast:
    type: float
    domain: "[0.0, 1.0]"
  w_group_atmost:
    type: float
    domain: "[0.0, 1.0]"
  w_group_all:
    type: float
    domain: "[0.0, 1.0]"
  w_group_none:
    type: float
    domain: "[0.0, 1.0]"
  w_balance:
    type: float
    domain: "[0.0, 1.0]"
  w_weighted_eq:
    type: float
    domain: "[0.0, 1.0]"

  group_size_min:
    type: int
    domain: "[1, 5]"
  group_size_max:
    type: int
    domain: "[3, 10]"
  text_style:
    type: enum
    domain: "['concise', 'verbose']"

  ensure_forced_min:
    type: int
    domain: "[1, 3]"
  max_attempts:
    type: int
    domain: "[3, 10]"
  seed:
    type: int
    domain: "[0, 1000000000]"

  precomputed:
    formula: "function_2(rows, cols, neighbor_mode, inf_prob, mask_safe_prob, seed, ensure_forced_min, max_attempts, rule_min, rule_max, use_neighbor_rules, use_group_rules, w_neighbor_eq, w_neighbor_zero, w_group_eq, w_group_atleast, w_group_atmost, w_group_all, w_group_none, w_balance, w_weighted_eq, group_size_min, group_size_max, text_style)"

  grid_data:
    formula: "precomputed['grid_data']"
  unknown_keys:
    formula: "precomputed['unknown_keys']"
  number_cells:
    formula: "precomputed['number_cells']"
  neighbors_unknown_keys:
    formula: "precomputed['neighbors_unknown_keys']"
  rules_desc:
    formula: "precomputed['rules_desc']"
  infected_truth_coords:
    formula: "precomputed['infected_truth_coords']"

  group_rules_eq:
    formula: "precomputed['group_rules_eq']"
  group_rules_atleast:
    formula: "precomputed['group_rules_atleast']"
  group_rules_atmost:
    formula: "precomputed['group_rules_atmost']"
  group_rules_all:
    formula: "precomputed['group_rules_all']"
  group_rules_none:
    formula: "precomputed['group_rules_none']"
  balance_rules:
    formula: "precomputed['balance_rules']"
  weighted_rules:
    formula: "precomputed['weighted_rules']"

  grid_rows_desc:
    formula: "['行' + str(i) + ': ' + '  '.join([str(x) for x in grid_data[i]]) for i in range(rows)]"
  rows_desc_string:
    formula: "'[' + '; '.join(['行' + str(i) + ': ' + '  '.join([str(x) for x in grid_data[i]]) for i in range(rows)]) + ']'"
  rules_desc_string:
    formula: "'[' + '; '.join(rules_desc) + ']'"

symbols:
  infected_s:
    source:
    - unknown_keys
    type: Bool
    desc: "The cell at {_unknown_keys} is infected"

conditions:
  numbered_cells_count_constraint:
    formula: And([Sum([If(infected_s[k], 1, 0) for k in neighbors_unknown_keys[i]]) == number_cells[i][2] for i in range(len(number_cells))])
    desc: '每个显示为数字的格子，其六邻域中的未知邻居的感染数之和严格等于该数字。'
  group_eq_constraints:
    formula: And([Sum([If(infected_s[k], 1, 0) for k in rule['keys']]) == rule['k'] for rule in group_rules_eq])
    desc: '集合型恰好约束：指定集合的感染数恰等于给定值。'
  group_atleast_constraints:
    formula: And([Sum([If(infected_s[k], 1, 0) for k in rule['keys']]) >= rule['k'] for rule in group_rules_atleast])
    desc: '集合型下界约束：指定集合的感染数至少为k。'
  group_atmost_constraints:
    formula: And([Sum([If(infected_s[k], 1, 0) for k in rule['keys']]) <= rule['k'] for rule in group_rules_atmost])
    desc: '集合型上界约束：指定集合的感染数至多为k。'
  group_all_constraints:
    formula: And([And([infected_s[k] for k in rule['keys']]) for rule in group_rules_all])
    desc: '集合型全感染约束：集合内所有坐标均为感染。'
  group_none_constraints:
    formula: And([Sum([If(infected_s[k], 1, 0) for k in rule['keys']]) == 0 for rule in group_rules_none])
    desc: '集合型全安全约束：集合内不存在感染。'
  balance_constraints:
    formula: And([Sum([If(infected_s[k], 1, 0) for k in rule['A']]) == Sum([If(infected_s[k], 1, 0) for k in rule['B']]) for rule in balance_rules])
    desc: '平衡约束：两个集合的感染数量相等。'
  weighted_eq_constraints:
    formula: And([Sum([rule['weights'][i] * If(infected_s[rule['keys'][i]], 1, 0) for i in range(len(rule['keys']))]) == rule['k'] for rule in weighted_rules])
    desc: '加权等式约束：加权感染计数之和等于指定值。'

calc_solution: true
max_solution: 3

post_generation:
  post_gen_vars:
    infected_coords_solution: "[(int(k.split(',')[0]), int(k.split(',')[1])) for k in unknown_keys if get_value(_sol, infected_s[k])]"
    total_infected: "len(infected_coords_solution)"

queries:
  q1:
    desc: '请给出所有感染坐标的列表以及总感染数。答案格式为: [(r,c), ...]====N'
    ans_formula: "str(infected_coords_solution) + '====' + str(total_infected)"
    ans_text: "_ans"
    ans_assertion: "len(_solutions) == 1"

desc: '标题: 高阶六角蜂巢感染推理（六角网格6邻域，模式: {neighbor_mode}）\n- 说明: 邻域采用六角网格的行偏移模式。even_r表示偶数行右上与右下的偏移，odd_r表示奇数行右上与右下的偏移。数字表示该格的六邻居中感染的数量，X为未确认。仅未知格可能为感染。\n- 输入网格({rows}行x{cols}列): {rows_desc_string}\n- 随机生成的规则说明: {rules_desc_string}\n- 任务: 在上述复合规则下进行多步推理，确定所有感染坐标与总感染数。请按答案格式填写: [(r,c), ...]====N。\n{q1}'