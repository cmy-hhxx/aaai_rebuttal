# ==============================================================
# High-Complexity Quadratic Puzzle Specification (final version)
# ==============================================================

custom_operator:
  function_1: operation_3.py          # 占位，供框架旧引用
  function_2: operation_3.py
  gen_coeff_and_clues: operation_3.py
  format_poly: operation_3.py
  compute_min_info: operation_3.py

# -------------------- Variables --------------------
variables:
  coef_keys:
    formula: "['A', 'B', 'C']"

  all_params:
    formula: gen_coeff_and_clues()          # (A,B,C,S,D,P,F1)

  A:  {formula: "all_params[0]"}
  B:  {formula: "all_params[1]"}
  C:  {formula: "all_params[2]"}
  S:  {formula: "all_params[3]"}
  D:  {formula: "all_params[4]"}
  P:  {formula: "all_params[5]"}
  F1: {formula: "all_params[6]"}

  poly_str:
    formula: format_poly(A, B, C)
  min_info:
    formula: compute_min_info(A, B, C)
  min_k:
    formula: "min_info[0]"
  min_value:
    formula: "min_info[1]"

# -------------------- Symbols & Conditions --------------------
symbols:
  coef:
    source:
      - coef_keys
    type: int
    desc: ''

conditions:
  range_A:
    formula: "And(coef['A'] >= 1, coef['A'] <= 5)"
  range_B:
    formula: "And(coef['B'] >= -10, coef['B'] <= 10)"
  range_C:
    formula: "And(coef['C'] >= -10, coef['C'] <= 10)"
  clue_sum:
    formula: "coef['B'] + coef['C'] == S"
  clue_diff:
    formula: "coef['A'] - coef['B'] == D"
  clue_prod:
    formula: "coef['B'] * coef['C'] == P"
  clue_f1:
    formula: "coef['A'] + coef['B'] + coef['C'] == F1"

max_solution: 1
calc_solution: true

# -------------------- Queries --------------------
queries:
  q1:
    desc: '根据以下线索求出 f(k) 的展开式（按 k²→k→常数顺序）并填写：'
    ans_formula: "poly_str"
    ans_text: '_ans'
    ans_assertion: "True"

  q2:
    desc: '求该二次函数的最小值及对应的 k，请用 “k_min, f_min” 书写，示例：-3/2, -5/4'
    ans_formula: "str(min_k) + ', ' + str(min_value)"
    ans_text: '_ans'
    ans_assertion: "True"

# -------------------- Description --------------------
desc: '已知二次函数 f(k)=Ak²+Bk+C，系数满足 A∈[1,5] 且 B,C∈[-10,10]，并给出以下四条线索：① B+C={S}; ② A-B={D}; ③ B×C={P}; ④ f(1)={F1}。{queries}'