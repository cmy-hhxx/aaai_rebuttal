custom_operator:
  # 自定义生成器与评估器
  gen_instance: web_of_lies_2.py
  clause_eval: web_of_lies_2.py
  # 文本化规则
  role_text: web_of_lies_2.py
  leader_rule_text: web_of_lies_2.py
  public_counts_text: web_of_lies_2.py
  build_leader_announce_text: web_of_lies_2.py
  # 站点/站长规则约束
  station_role_constraint: web_of_lies_2.py
  leader_role_constraint: web_of_lies_2.py
  leader_tiebreak_constraint: web_of_lies_2.py
  # 答案格式化（兼容单参与双参调用）
  format_answer: web_of_lies_2.py

# 为了快速剪枝丢弃非唯一解实例
max_solution: 1

variables:
  # 生成完整实例（逆向生成隐藏解，再产出陈述与显示条件）
  inst:
    formula: gen_instance()
  people:
    formula: inst['people']
  p_num:
    formula: inst['p_num']
  stations:
    formula: inst['stations']
  s_num:
    formula: inst['s_num']
  team_size:
    formula: inst['team_size']
  roles:
    formula: inst['roles']
  ctype:
    formula: inst['ctype']
  cA:
    formula: inst['cA']
  cB:
    formula: inst['cB']
  clause_texts:
    formula: inst['clause_texts']
  # 公开提示：各站说真话人数 & 全网说真话的站长总数
  st_counts:
    formula: inst['st_counts']
  leader_truth_total:
    formula: inst['leader_truth_total']
  # 公开提示：随机公开 0 或 1 个站的站长姓名
  known_leader_indices:
    formula: inst['known_leader_indices']
  known_leader_names:
    formula: inst['known_leader_names']
  # 文本化
  role_desc:
    formula: '[role_text(roles[i]) for i in range(s_num)]'
  leader_desc:
    formula: '[leader_rule_text(roles[i]) for i in range(s_num)]'
  names_text:
    formula: '", ".join(people)'
  stations_text:
    formula: '", ".join(stations)'
  role_block:
    formula: '"；".join([stations[i] + "：" + role_desc[i] + "；" + leader_desc[i] for i in range(s_num)])'
  clauses_block:
    formula: '"\\n".join([people[i] + "：“" + clause_texts[i][0] + "；" + clause_texts[i][1] + "”。" for i in range(p_num)])'
  hints_text:
    formula: 'public_counts_text(stations, st_counts, leader_truth_total)'
  leader_announce_text:
    formula: 'build_leader_announce_text(stations, known_leader_indices, known_leader_names)'
  # 站长选拔细则（公开）
  tiebreak_text:
    formula: '"人事规定：如同站存在多名符合站长规则的候选，则按姓名字母序最靠前者担任站长（A 最靠前，其次 B，依此类推）"'

symbols:
  # 位置布尔符号：是否 p 在 s
  loc:
    source:
    - people
    - stations
    type: bool
    desc: '{_people} 在 {_stations}'
  # 真假布尔符号：truth_s[p] 表示 p 的两句陈述是否都为真
  truth_s:
    source:
    - people
    type: bool
    desc: '{_people} 说真话'
  # 站长布尔符号：lead[p] 表示 p 是否为站长（未知）
  lead:
    source:
    - people
    type: bool
    desc: '{_people} 是站长'

conditions:
  # 每人恰好在一个站
  one_station_per_person:
    formula: 'And([Sum([If(loc[(p, s)], 1, 0) for s in stations]) == 1 for p in people])'
    desc: '每位调度员恰好在一个站点值守'
  # 每站恰好 team_size 人
  team_per_station:
    formula: 'And([Sum([If(loc[(p, s)], 1, 0) for p in people]) == team_size for s in stations])'
    desc: '每个站点恰有固定编制人数'
  # 每站恰有一名站长（站长必须在该站值守）
  leader_per_station:
    formula: 'And([Sum([If(And(loc[(p, stations[i])], lead[p]), 1, 0) for p in people]) == 1 for i in range(s_num)])'
    desc: '每个站点恰有一名站长'
  # 站点真话模式约束
  station_truth_patterns:
    formula: 'station_role_constraint(roles, stations, people, loc, truth_s, team_size)'
    desc: '各站点的“真话模式”被正确施加'
  # 站长规则约束
  leader_rule_patterns:
    formula: 'leader_role_constraint(roles, stations, people, loc, truth_s, lead, team_size)'
    desc: '各站点的“站长规则”被正确施加'
  # 站长选拔细则（对称性打破，双向）
  leader_tiebreaking:
    formula: 'leader_tiebreak_constraint(roles, stations, people, loc, truth_s, lead, team_size)'
    desc: '选拔细则：如同站存在多名符合站长规则的候选，则按姓名字母序最靠前者担任站长'
  # 真假由两条陈述决定：truth_s[p] 等于两句陈述同时为真
  truth_defined_by_clauses:
    formula: 'And([truth_s[people[i]] == And(clause_eval(ctype[i][0], cA[i][0], cB[i][0], i, people, stations, loc, truth_s, lead, team_size), clause_eval(ctype[i][1], cA[i][1], cB[i][1], i, people, stations, loc, truth_s, lead, team_size)) for i in range(p_num)])'
    desc: '每人的真假等价于其两条陈述的逻辑与'
  # 公开提示硬约束：每站说真话人数固定为 st_counts[i]
  announced_truth_counts:
    formula: 'And([Sum([If(And(loc[(p, stations[i])], truth_s[p]), 1, 0) for p in people]) == st_counts[i] for i in range(s_num)])'
    desc: '公开提示约束：各站说真话人数固定'
  # 公开提示硬约束：全网说真话的站长总数固定
  announced_leader_truth_total:
    formula: 'Sum([If(And(lead[p], truth_s[p]), 1, 0) for p in people]) == leader_truth_total'
    desc: '公开提示约束：说真话的站长总数固定'
  # 新增公开提示硬约束：部分站点的站长姓名已知（0或1个）
  announced_specific_leaders:
    formula: 'And([And(lead[known_leader_names[i]], loc[(known_leader_names[i], stations[known_leader_indices[i]])]) for i in range(len(known_leader_indices))])'
    desc: '公开提示约束：部分站点的站长姓名已知（0或1个）'

queries:
  q1:
    desc: '问题：请给出每个站的人员名单，并标注其是否说真话（T/F）。答案格式与顺序要求：按题面给出的站点顺序；各站内按姓名字母序。格式为 站名: 名字(T/F), 名字(T/F)[, ...] | 站名: ...。示例：中央: A(T), B(F) | 东站: C(T), D(T) | 西站: E(F), F(T)'
    ans_formula: 'format_answer(stations, [[(p, get_value(_solutions[0], truth_s[p])) for p in people if get_value(_solutions[0], loc[(p, stations[i])])] for i in range(s_num)])'
    ans_text: '{_ans}'
    ans_assertion: 'len(_solutions) == 1'

desc: '城市地铁调度·泛化版（站长扩展）：共有 {p_num} 名调度员 {names_text}，共有 {s_num} 个站点，每站安排 {team_size} 人：{stations_text}。\\n规则说明：每位调度员各说两句话；若某人的两句都为真，则称其为“说真话者”，否则为“说谎者”。每个站点恰有一名“站长”（站长是本站的某一位调度员），并且各站的“真话模式”与“站长规则”如下：\\n{role_block}。\\n{tiebreak_text}。\\n{hints_text}。\\n{leader_announce_text}。\\n每位调度员的两句话如下：\\n{clauses_block}\\n{q1}'