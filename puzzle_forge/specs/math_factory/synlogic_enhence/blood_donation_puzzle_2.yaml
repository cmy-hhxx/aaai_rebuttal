custom_operator:
  gen_names: blood_donation_puzzle_2.py
  shuffle_list: blood_donation_puzzle_2.py
  gen_pitches: blood_donation_puzzle_2.py
  pick_distinct_indices: blood_donation_puzzle_2.py
  randint_n: blood_donation_puzzle_2.py
  randint_between: blood_donation_puzzle_2.py
  choice_one: blood_donation_puzzle_2.py

# =================================================================
# 变量定义（环境、隐式属性与线索参数，含随机化）
# =================================================================
variables:
  # 座位数量
  n:
    type: int
    domain: "[5, 5]"
    diff_factor: 1

  # 座位编号（1..n）
  positions:
    formula: "list(range(1, n + 1))"

  # 姓名、乐器、乐章、音高（文本）
  names:
    formula: "gen_names(n)"
  instruments_base:
    formula: "['长笛', '双簧管', '单簧管', '大管', '萨克斯']"
  instruments:
    formula: "shuffle_list(instruments_base)"
  movements:
    formula: "['第一', '第二', '第三', '第四', '终章']"
  pitches:
    formula: "gen_pitches(n)"

  # 便于题面渲染的描述串
  name_desc:
    formula: "', '.join(names)"
  instrument_desc:
    formula: "', '.join(instruments)"
  movement_desc:
    formula: "', '.join(movements)"
  pitch_desc:
    formula: "', '.join(pitches)"

  # 隐式属性：簧类映射与类别索引集合
  instr_reed_map:
    formula: "{'长笛': '无簧', '双簧管': '双簧', '单簧管': '单簧', '大管': '双簧', '萨克斯': '单簧'}"
  instr_reed_types:
    formula: "[instr_reed_map[name] for name in instruments]"
  double_reed_indices:
    formula: "[i for i, t in enumerate(instr_reed_types) if t == '双簧']"
  single_reed_indices:
    formula: "[i for i, t in enumerate(instr_reed_types) if t == '单簧']"

  # 隐式属性：音高数值及中位
  pitch_values:
    formula: "[int(p[1:]) for p in pitches]"
  pitch_sorted_indices:
    formula: "sorted(list(range(n)), key=lambda i: pitch_values[i])"
  pitch_mid_idx:
    formula: "pitch_sorted_indices[n // 2]"

  # 线索1参数：乐器与音高相对距离
  c1_instr_idx:
    formula: "randint_n(n)"
  c1_pitch_idx:
    formula: "randint_n(n)"
  adj_dist_c1:
    formula: "randint_between(1, 2)"
  adj_text_c1:
    formula: "'相邻' if adj_dist_c1 == 1 else '中间隔一人'"

  # 线索2：某人不拉某乐器，且该人对应某乐章
  tmp_c2:
    formula: "pick_distinct_indices(n, 3)"
  c2_person_idx:
    formula: "tmp_c2[0]"
  c2_instr_idx:
    formula: "tmp_c2[1]"
  c2_mov_idx:
    formula: "tmp_c2[2]"

  # 线索3：一乐章在另一乐章某侧且至少隔k
  tmp_c3:
    formula: "pick_distinct_indices(n, 2)"
  c3_right_mov_idx:
    formula: "tmp_c3[0]"
  c3_left_mov_idx:
    formula: "tmp_c3[1]"
  c3_dir:
    formula: "choice_one(['right', 'left'])"
  c3_dir_text:
    formula: "'右侧' if c3_dir == 'right' else '左侧'"
  c3_gap_at_least:
    formula: "randint_between(1, 2)"
  c3_gap_text:
    formula: "'不相邻' if c3_gap_at_least == 1 else '中间至少隔一人'"

  # 线索4：某乐器使用某音高；另一件乐器不在指定端点策略
  tmp_c4_eq:
    formula: "pick_distinct_indices(n, 2)"
  c4_instr_eq_idx:
    formula: "tmp_c4_eq[0]"
  c4_pitch_eq_idx:
    formula: "tmp_c4_eq[1]"
  tmp_c4_noedge:
    formula: "pick_distinct_indices(n, 2)"
  c4_instr_noedge_idx:
    formula: "tmp_c4_noedge[0]"
  c4_edge_type:
    formula: "choice_one(['not_ends', 'not_left', 'not_right'])"
  c4_edge_text:
    formula: "'不在端点' if c4_edge_type == 'not_ends' else ('不在最左端' if c4_edge_type == 'not_left' else '不在最右端')"

  # 线索5：两个人相对距离；另一个人不演奏某乐章
  tmp_c5_persons:
    formula: "pick_distinct_indices(n, 3)"
  c5_p1_idx:
    formula: "tmp_c5_persons[0]"
  c5_p2_idx:
    formula: "tmp_c5_persons[1]"
  c5_p3_idx:
    formula: "tmp_c5_persons[2]"
  c5_mov_not_idx:
    formula: "randint_n(n)"
  c5_adj_dist:
    formula: "randint_between(1, 2)"
  c5_adj_text:
    formula: "'相邻' if c5_adj_dist == 1 else '中间隔一人'"

  # 线索6：某音高在另一音高某侧；且某音高不出现在某乐章
  tmp_c6_pitches:
    formula: "pick_distinct_indices(n, 2)"
  c6_pitch_right_idx:
    formula: "tmp_c6_pitches[0]"
  c6_pitch_left_idx:
    formula: "tmp_c6_pitches[1]"
  tmp_c6_ban:
    formula: "pick_distinct_indices(n, 2)"
  c6_pitch_ban_idx:
    formula: "tmp_c6_ban[0]"
  c6_mov_ban_idx:
    formula: "tmp_c6_ban[1]"
  c6_dir:
    formula: "choice_one(['right', 'left'])"
  c6_dir_text:
    formula: "'右侧' if c6_dir == 'right' else '左侧'"

  # 线索7：某乐器在某端，且与另一乐器不相邻
  tmp_c7_instrs:
    formula: "pick_distinct_indices(n, 2)"
  c7_leftmost_instr_idx:
    formula: "tmp_c7_instrs[0]"
  c7_not_adj_instr_idx:
    formula: "tmp_c7_instrs[1]"
  c7_endpoint_pos:
    formula: "1 if choice_one([True, False]) else n"
  c7_endpoint_text:
    formula: "'最左端' if c7_endpoint_pos == 1 else '最右端'"

  # 线索8：某乐器对应某乐章
  tmp_c8:
    formula: "pick_distinct_indices(n, 2)"
  c8_instr_idx:
    formula: "tmp_c8[0]"
  c8_mov_eq_idx:
    formula: "tmp_c8[1]"

  # 线索9：某人演奏某乐章
  tmp_c9:
    formula: "pick_distinct_indices(n, 2)"
  c9_person_idx:
    formula: "tmp_c9[0]"
  c9_mov_idx:
    formula: "tmp_c9[1]"

  # 线索10：某人在另一人某侧
  tmp_c10:
    formula: "pick_distinct_indices(n, 2)"
  c10_left_person_idx:
    formula: "tmp_c10[0]"
  c10_right_person_idx:
    formula: "tmp_c10[1]"
  c10_dir:
    formula: "choice_one(['left', 'right'])"
  c10_dir_text:
    formula: "'左侧' if c10_dir == 'left' else '右侧'"

  # 线索11：两件双簧类乐器相对于某乐章在同一侧
  c11_anchor_mov_idx:
    formula: "randint_n(n)"
  c11_side:
    formula: "choice_one(['left', 'right'])"
  c11_side_text:
    formula: "'左侧' if c11_side == 'left' else '右侧'"

  # 线索12：中位音高绑定某位乐手
  c12_person_idx:
    formula: "randint_n(n)"

  # 线索13：终章与某音高座位号的奇偶关系
  term_mov_idx:
    formula: "movements.index('终章')"
  c13_pitch_idx:
    formula: "randint_n(n)"
  c13_parity:
    formula: "choice_one(['same', 'diff'])"
  c13_parity_text:
    formula: "'相同奇偶' if c13_parity == 'same' else '不同奇偶'"

  # 提问目标随机化
  q1_inst_idx:
    formula: "randint_n(n)"
  q2_inst_idx:
    formula: "randint_n(n)"
  q3_mov_idx:
    formula: "randint_n(n)"

# =================================================================
# 符号定义：座位为主键，携带四个整型属性（人、乐器、乐章、音高的索引）
# =================================================================
symbols:
  seat:
    source:
    - positions
    attr:
    - person
    - instr
    - movement
    - pitch
    type:
    - int
    - int
    - int
    - int
    desc:
    - '{_positions}号位的乐手索引'
    - '{_positions}号位的乐器索引'
    - '{_positions}号位的乐章索引'
    - '{_positions}号位的定音音高索引'

# =================================================================
# 约束条件：环境与13条线索（均需满足）
# =================================================================
conditions:
  # 属性索引域
  person_domain:
    formula: And([And(x >= 0, x < n) for x in seat.get('person')])
    desc: '每个座位的乐手索引在0到n-1之间'
  instr_domain:
    formula: And([And(x >= 0, x < n) for x in seat.get('instr')])
    desc: '每个座位的乐器索引在0到n-1之间'
  movement_domain:
    formula: And([And(x >= 0, x < n) for x in seat.get('movement')])
    desc: '每个座位的乐章索引在0到n-1之间'
  pitch_domain:
    formula: And([And(x >= 0, x < n) for x in seat.get('pitch')])
    desc: '每个座位的定音音高索引在0到n-1之间'

  # 各属性互异
  person_distinct:
    formula: Distinct(seat.get('person'))
    desc: '每位乐手恰好占据一个不同的座位'
  instr_distinct:
    formula: Distinct(seat.get('instr'))
    desc: '每件乐器恰好占据一个不同的座位'
  movement_distinct:
    formula: Distinct(seat.get('movement'))
    desc: '每个乐章恰好对应一个不同的座位'
  pitch_distinct:
    formula: Distinct(seat.get('pitch'))
    desc: '每个定音音高恰好对应一个不同的座位'

  # 线索1：某乐器与某音高相距给定距离
  clue_1:
    formula: And([Implies(And(seat[p].get('instr') == c1_instr_idx, seat[q].get('pitch') == c1_pitch_idx), Or(p == q + adj_dist_c1, p == q - adj_dist_c1)) for p in positions for q in positions])
    desc: '拉{instruments[c1_instr_idx]}的人与使用{pitches[c1_pitch_idx]}的人{adj_text_c1}'

  # 线索2：某人不拉某乐器，且该人演奏某乐章
  clue_2:
    formula: And([Implies(seat[p].get('person') == c2_person_idx, And(seat[p].get('instr') != c2_instr_idx, seat[p].get('movement') == c2_mov_idx)) for p in positions])
    desc: '{names[c2_person_idx]}不拉{instruments[c2_instr_idx]}且他演奏{movements[c2_mov_idx]}乐章'

  # 线索3：某乐章在另一乐章指定方向且至少隔指定位数
  clue_3:
    formula: And([Implies(And(seat[p].get('movement') == c3_right_mov_idx, seat[q].get('movement') == c3_left_mov_idx), And(p > q, p - q >= c3_gap_at_least + 1)) for p in positions for q in positions]) if c3_dir == 'right' else And([Implies(And(seat[p].get('movement') == c3_right_mov_idx, seat[q].get('movement') == c3_left_mov_idx), And(p < q, q - p >= c3_gap_at_least + 1)) for p in positions for q in positions])
    desc: '{movements[c3_right_mov_idx]}乐章在{movements[c3_left_mov_idx]}乐章的{c3_dir_text}且{c3_gap_text}'

  # 线索4：某乐器使用某音高；另一件乐器不在端点策略
  clue_4:
    formula: And(And([Implies(seat[p].get('instr') == c4_instr_eq_idx, seat[p].get('pitch') == c4_pitch_eq_idx) for p in positions]), And([Implies(seat[p].get('instr') == c4_instr_noedge_idx, And(p > 1, p < n)) for p in positions])) if c4_edge_type == 'not_ends' else (And(And([Implies(seat[p].get('instr') == c4_instr_eq_idx, seat[p].get('pitch') == c4_pitch_eq_idx) for p in positions]), And([Implies(seat[p].get('instr') == c4_instr_noedge_idx, p > 1) for p in positions])) if c4_edge_type == 'not_left' else And(And([Implies(seat[p].get('instr') == c4_instr_eq_idx, seat[p].get('pitch') == c4_pitch_eq_idx) for p in positions]), And([Implies(seat[p].get('instr') == c4_instr_noedge_idx, p < n) for p in positions])))
    desc: '{instruments[c4_instr_eq_idx]}使用{pitches[c4_pitch_eq_idx]}且{instruments[c4_instr_noedge_idx]}{c4_edge_text}'

  # 线索5：两个人相距给定距离；另一个人不演奏某乐章
  clue_5:
    formula: And(And([Implies(And(seat[p].get('person') == c5_p1_idx, seat[q].get('person') == c5_p2_idx), Or(p == q + c5_adj_dist, p == q - c5_adj_dist)) for p in positions for q in positions]), And([Implies(seat[p].get('person') == c5_p3_idx, seat[p].get('movement') != c5_mov_not_idx) for p in positions]))
    desc: '{names[c5_p1_idx]}与{names[c5_p2_idx]}{c5_adj_text}且{names[c5_p3_idx]}不在{movements[c5_mov_not_idx]}乐章'

  # 线索6：某音高在另一音高指定方向；某音高不出现在某乐章
  clue_6:
    formula: And(And([Implies(And(seat[p].get('pitch') == c6_pitch_right_idx, seat[q].get('pitch') == c6_pitch_left_idx), p > q) for p in positions for q in positions]), And([Implies(seat[p].get('movement') == c6_mov_ban_idx, seat[p].get('pitch') != c6_pitch_ban_idx) for p in positions])) if c6_dir == 'right' else And(And([Implies(And(seat[p].get('pitch') == c6_pitch_right_idx, seat[q].get('pitch') == c6_pitch_left_idx), p < q) for p in positions for q in positions]), And([Implies(seat[p].get('movement') == c6_mov_ban_idx, seat[p].get('pitch') != c6_pitch_ban_idx) for p in positions]))
    desc: '{pitches[c6_pitch_right_idx]}在{pitches[c6_pitch_left_idx]}的{c6_dir_text}且{pitches[c6_pitch_ban_idx]}不出现在{movements[c6_mov_ban_idx]}乐章'

  # 线索7：某乐器在某端，且与另一乐器不相邻
  clue_7:
    formula: And(And([Implies(seat[p].get('instr') == c7_leftmost_instr_idx, p == c7_endpoint_pos) for p in positions]), And([Implies(And(seat[p].get('instr') == c7_leftmost_instr_idx, seat[q].get('instr') == c7_not_adj_instr_idx), And(p != q + 1, p != q - 1)) for p in positions for q in positions]))
    desc: '{instruments[c7_leftmost_instr_idx]}在{c7_endpoint_text}且拉{instruments[c7_leftmost_instr_idx]}的人不与拉{instruments[c7_not_adj_instr_idx]}的人相邻'

  # 线索8：某乐器对应某乐章
  clue_8:
    formula: And([Implies(seat[p].get('instr') == c8_instr_idx, seat[p].get('movement') == c8_mov_eq_idx) for p in positions])
    desc: '{instruments[c8_instr_idx]}对应{movements[c8_mov_eq_idx]}乐章'

  # 线索9：某人演奏某乐章
  clue_9:
    formula: And([Implies(seat[p].get('person') == c9_person_idx, seat[p].get('movement') == c9_mov_idx) for p in positions])
    desc: '{names[c9_person_idx]}演奏{movements[c9_mov_idx]}乐章'

  # 线索10：某人在另一人某侧
  clue_10:
    formula: And([Implies(And(seat[p].get('person') == c10_left_person_idx, seat[q].get('person') == c10_right_person_idx), p < q) for p in positions for q in positions]) if c10_dir == 'left' else And([Implies(And(seat[p].get('person') == c10_left_person_idx, seat[q].get('person') == c10_right_person_idx), p > q) for p in positions for q in positions])
    desc: '{names[c10_left_person_idx]}在{names[c10_right_person_idx]}的{c10_dir_text}'

  # 线索11：两件双簧类乐器相对于某乐章在同一侧
  clue_11:
    formula: And(And([Implies(And(seat[a].get('movement') == c11_anchor_mov_idx, seat[p].get('instr') == double_reed_indices[0]), p < a) for a in positions for p in positions]), And([Implies(And(seat[a].get('movement') == c11_anchor_mov_idx, seat[q].get('instr') == double_reed_indices[1]), q < a) for a in positions for q in positions])) if c11_side == 'left' else And(And([Implies(And(seat[a].get('movement') == c11_anchor_mov_idx, seat[p].get('instr') == double_reed_indices[0]), p > a) for a in positions for p in positions]), And([Implies(And(seat[a].get('movement') == c11_anchor_mov_idx, seat[q].get('instr') == double_reed_indices[1]), q > a) for a in positions for q in positions]))
    desc: '双簧管与大管都在{movements[c11_anchor_mov_idx]}乐章的{c11_side_text}'

  # 线索12：中位音高由某位乐手演奏
  clue_12:
    formula: And([Implies(seat[p].get('person') == c12_person_idx, seat[p].get('pitch') == pitch_mid_idx) for p in positions])
    desc: '{names[c12_person_idx]}使用的定音音高是五个给定音高中位值'

  # 线索13：终章与某音高座位号奇偶关系
  clue_13:
    formula: And([Implies(And(seat[p].get('movement') == term_mov_idx, seat[q].get('pitch') == c13_pitch_idx), ((p + q) % 2 == 0)) for p in positions for q in positions]) if c13_parity == 'same' else And([Implies(And(seat[p].get('movement') == term_mov_idx, seat[q].get('pitch') == c13_pitch_idx), ((p + q) % 2 == 1)) for p in positions for q in positions])
    desc: '演奏终章的座位号与使用{pitches[c13_pitch_idx]}的座位号具有{c13_parity_text}性'

# 为确保唯一解，同时答案生成断言也校验唯一性
max_solution: 1

# =================================================================
# 提问（答案严格格式说明）
# =================================================================
queries:
  q1:
    desc: '谁演奏{instruments[q1_inst_idx]} 请输出姓名 例如 {names[0]}'
    ans_formula: 'names[get_value(_solutions[0], seat[[p for p in positions if get_value(_solutions[0], seat[p].get(''instr'')) == q1_inst_idx][0]].get(''person''))]'
    ans_text: '{_ans}'
    ans_assertion: 'len(_solutions) == 1'
  q2:
    desc: '演奏{instruments[q2_inst_idx]}的座位号是多少 请输出整数 例如 3'
    ans_formula: '[p for p in positions if get_value(_solutions[0], seat[p].get(''instr'')) == q2_inst_idx][0]'
    ans_text: '{_ans}'
    ans_assertion: 'len(_solutions) == 1'
  q3:
    desc: '谁演奏{movements[q3_mov_idx]}乐章 请输出姓名 例如 {names[0]}'
    ans_formula: 'names[get_value(_solutions[0], seat[[p for p in positions if get_value(_solutions[0], seat[p].get(''movement'')) == q3_mov_idx][0]].get(''person''))]'
    ans_text: '{_ans}'
    ans_assertion: 'len(_solutions) == 1'

# =================================================================
# 题面描述（仅展示环境与线索与作答要求）
# =================================================================
desc: '有一排共{n}个座位 从左到右编号为1到{n} 需要安排{n}位乐手每人一件乐器一个乐章与一个定音音高 且每个座位恰有一位乐手一件乐器一个乐章和一个定音音高 并且四类属性各不相同 乐手为 {name_desc} 乐器为 {instrument_desc} 乐章为 {movement_desc} 定音音高为 {pitch_desc} 为便于理解 本题中的定音音高形如A加数字 数字越大音越高 中位值指这五个数字按大小排序处于中间的那个 奇偶性指座位号对2取模\n线索如下：\n1 拉{instruments[c1_instr_idx]}的人与使用{pitches[c1_pitch_idx]}的人{adj_text_c1}\n2 {names[c2_person_idx]}不拉{instruments[c2_instr_idx]}且他演奏{movements[c2_mov_idx]}乐章\n3 {movements[c3_right_mov_idx]}乐章在{movements[c3_left_mov_idx]}乐章的{c3_dir_text}且{c3_gap_text}\n4 {instruments[c4_instr_eq_idx]}使用{pitches[c4_pitch_eq_idx]}且{instruments[c4_instr_noedge_idx]}{c4_edge_text}\n5 {names[c5_p1_idx]}与{names[c5_p2_idx]}{c5_adj_text}且{names[c5_p3_idx]}不在{movements[c5_mov_not_idx]}乐章\n6 {pitches[c6_pitch_right_idx]}在{pitches[c6_pitch_left_idx]}的{c6_dir_text}且{pitches[c6_pitch_ban_idx]}不出现在{movements[c6_mov_ban_idx]}乐章\n7 {instruments[c7_leftmost_instr_idx]}在{c7_endpoint_text}且拉{instruments[c7_leftmost_instr_idx]}的人不与拉{instruments[c7_not_adj_instr_idx]}的人相邻\n8 {instruments[c8_instr_idx]}对应{movements[c8_mov_eq_idx]}乐章\n9 {names[c9_person_idx]}演奏{movements[c9_mov_idx]}乐章\n10 {names[c10_left_person_idx]}在{names[c10_right_person_idx]}的{c10_dir_text}\n11 双簧管与大管都在{movements[c11_anchor_mov_idx]}乐章的{c11_side_text}\n12 {names[c12_person_idx]}使用的定音音高是五个给定音高中位值\n13 演奏终章的座位号与使用{pitches[c13_pitch_idx]}的座位号具有{c13_parity_text}性\n作答要求：请严格按如下格式作答 若答案不完全一致即判为错误\n- 问题一 输出姓名 例如 {names[0]}\n- 问题二 输出座位数字 例如 3\n- 问题三 输出姓名 例如 {names[0]}\n{q1}\n{q2}\n{q3}\n'