custom_operator:
  generate_grid: survo_2.py

variables:
  grid_data:        {formula: "generate_grid()"}
  n:                {formula: "grid_data['n']"}
  prime_set:        {formula: "grid_data['prime_set']"}
  grid:             {formula: "grid_data['grid']"}
  row_totals:       {formula: "grid_data['row_sums']"}
  col_totals:       {formula: "grid_data['col_sums']"}
  mod_a:            {formula: "grid_data['mod_a']"}
  mod_b:            {formula: "grid_data['mod_b']"}
  mod_M:            {formula: "grid_data['mod_M']"}
  K:                {formula: "grid_data['K']"}
  unique_scope:     {formula: "grid_data['unique_scope']"}
  corner_values:    {formula: "grid_data['corner_values']"}
  diag_sum:         {formula: "grid_data['diag_sum']"}
  anti_diag_parity: {formula: "grid_data['anti_diag_parity']"}
  row_parity:       {formula: "grid_data['row_parity']"}
  high_threshold:   {formula: "grid_data['high_threshold']"}
  high_req:         {formula: "grid_data['high_req']"}

  rows_int:         {formula: "list(range(1, n+1))"}
  cols_int:         {formula: "list(range(1, n+1))"}
  rows_str:         {formula: "[str(i) for i in rows_int]"}
  cols_str:         {formula: "[str(i) for i in cols_int]"}
  corners:          {formula: "[(1,1),(1,n),(n,1),(n,n)]"}
  inner_positions:  {formula: "[(r,c) for r in rows_int for c in cols_int if (r,c) not in corners]"}
  query_pos:        {formula: "random.choice(inner_positions)"}
  query_row:        {formula: "query_pos[0]"}
  query_col:        {formula: "query_pos[1]"}
  uniq_desc:        {formula: "'行' if unique_scope=='row' else '列'"}
  parity_words:     {formula: "['偶数','奇数']"}

symbols:
  cell:
    source: [rows_str, cols_str]
    type: int
    desc: '表中行{_rows_str}列{_cols_str}的数字'

conditions:
  domain_corner:
    formula: >
      And([
        (cell[(str(r), str(c))] == corner_values[corners.index((r,c))])
        if (r,c) in corners else
        Or([cell[(str(r), str(c))] == p for p in prime_set])
        for r in rows_int for c in cols_int
      ])

  unique_rule:
    formula: >
      (And([Distinct([cell[(str(r), str(c))] for c in cols_int]) for r in rows_int])
       if unique_scope == 'row'
       else And([Distinct([cell[(str(r), str(c))] for r in rows_int]) for c in cols_int]))

  row_sum:
    formula: "And([Sum([cell[(str(r), str(c))] for c in cols_int]) == row_totals[r-1] for r in rows_int])"
  col_sum:
    formula: "And([Sum([cell[(str(r), str(c))] for r in rows_int]) == col_totals[c-1] for c in cols_int])"

  mod_rule:
    formula: >
      And([(((mod_a*r + mod_b*c + cell[(str(r), str(c))]) % mod_M) == K)
      for r in rows_int for c in cols_int if (r,c) not in corners])

  diag_cond:
    formula: "Sum([cell[(str(i), str(i))] for i in rows_int]) == diag_sum"
  anti_diag_parity_cond:
    formula: "(Sum([cell[(str(i), str(n+1-i))] for i in rows_int]) % 2) == anti_diag_parity"

  parity_cond:
    formula: "And([(Sum([cell[(str(r), str(c))] for c in cols_int]) % 2) == row_parity[r-1] for r in rows_int])"

  high_cond:
    formula: "And([Sum([If(cell[(str(r), str(c))] > high_threshold,1,0) for r in rows_int]) >= high_req for c in cols_int])"

queries:
  q1:
    desc: '填完所有未知格后, 行{query_row}列{query_col}处的数字是多少? 请仅填写一个整数 (例如 17)。负值直接写负号。'
    ans_formula: "get_value(_solutions[0], cell[(str(query_row), str(query_col))])"
    ans_text: "str(_ans)"

max_solution: 1
calc_solution: true
desc: '在下表中, 星际殖民地需要为 {n} 个星球记录 {n} 种资源的运输量 (单位: 吨)。内部 {n}×{n} 的格子需填入数字, 四角已知为偶数[{", ".join(map(str,corner_values))}]。\n规则:\n① 其余格子必须从质数集[{", ".join(map(str,prime_set))}]中选取;\n② 同一{uniq_desc}内数字不得重复;\n③ 同余规则: ({mod_a}·r + {mod_b}·c + X) % {mod_M} = {K};\n④ 主对角线所有数字之和为 {diag_sum};\n⑤ 副对角线数字之和为{parity_words[anti_diag_parity]};\n⑥ 第 r 行数字之和的奇偶性依次为[{", ".join([parity_words[p] for p in row_parity])}];\n⑦ 每列至少包含 {high_req} 个数字大于高值阈 {high_threshold};\n⑧ 每行总量为[{", ".join(map(str,row_totals))}], 每列总量为[{", ".join(map(str,col_totals))}]。(行列编号均从 1 开始)\n问题: 完成表格后, 行{query_row}列{query_col}处的数字是多少?\n答案格式: 仅填写一个整数, 例如 17。'