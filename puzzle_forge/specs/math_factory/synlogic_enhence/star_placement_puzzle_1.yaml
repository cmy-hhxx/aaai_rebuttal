custom_operator:
  function_1: star_placement_puzzle_1.py
  function_2: star_placement_puzzle_1.py

calc_solution: false

variables:
  n:
    type: int
    domain: "[6, 9]"
  rows:
    formula: "list(range(1, n + 1))"
  cols:
    formula: "list(range(1, n + 1))"
  region_mode:
    formula: "function_1('choice', ['row','col','diagonal','blocks'])"
  value_min:
    type: int
    domain: "[1, 5]"
  value_max:
    formula: "value_min + function_1('rand_int', {'lo': 5, 'hi': 8})"
  value_matrix:
    formula: "function_1('rand_value_matrix', {'n': n, 'min_v': value_min, 'max_v': value_max})"
  cost_min:
    type: int
    domain: "[1, 3]"
  cost_max:
    formula: "cost_min + function_1('rand_int', {'lo': 2, 'hi': 4})"
  cost_matrix:
    formula: "function_1('rand_cost_matrix', {'n': n, 'min_c': cost_min, 'max_c': cost_max})"
  letters:
    formula: "function_1('letters', n)"
  region_labels_2d:
    formula: "function_1('gen_region_labels', {'n': n, 'mode': region_mode, 'letters': letters})"
  regions:
    formula: "function_1('unique_regions', region_labels_2d)"
  region_cells:
    formula: "function_1('region_cells', region_labels_2d)"
  col_rule_candidates:
    formula: "['exactly']"
  region_rule_candidates:
    formula: "['at_most','exactly']"
  total_rule_candidates:
    formula: "['exactly']"
  adj_metric_candidates:
    formula: "['manhattan','chebyshev']"
  adj_distance_domain:
    formula: "[1, 1]"
  cluster_enable_candidates:
    formula: "[True, False]"
  cluster_k_candidates:
    formula: "[1, 2]"
  verify_time_limit_sec:
    type: int
    domain: "[45, 75]"
  max_resample_trials:
    type: int
    domain: "[3, 6]"
  rule_pack:
    formula: "function_1('gen_rules', {'n': n, 'rows': rows, 'cols': cols, 'regions': regions, 'region_cells': region_cells, 'col_rule_candidates': col_rule_candidates, 'region_rule_candidates': region_rule_candidates, 'total_rule_candidates': total_rule_candidates, 'adj_metric_candidates': adj_metric_candidates, 'adj_distance_domain': adj_distance_domain, 'cluster_enable_candidates': cluster_enable_candidates, 'cluster_k_candidates': cluster_k_candidates, 'value_matrix': value_matrix, 'cost_matrix': cost_matrix, 'verify_time_limit_sec': verify_time_limit_sec, 'max_resample_trials': max_resample_trials})"
  regions_text:
    formula: "function_1('format_grid_labels', region_labels_2d)"
  values_text:
    formula: "function_1('format_grid_values', value_matrix)"
  costs_text:
    formula: "function_1('format_grid_values', cost_matrix)"
  row_rule_text:
    formula: "function_1('extract_field', {'dict': rule_pack, 'key': 'row_rule_text'})"
  col_rule_text:
    formula: "function_1('extract_field', {'dict': rule_pack, 'key': 'col_rule_text'})"
  region_rule_text:
    formula: "function_1('extract_field', {'dict': rule_pack, 'key': 'region_rule_text'})"
  total_rule_text:
    formula: "function_1('extract_field', {'dict': rule_pack, 'key': 'total_rule_text'})"
  adjacency_text:
    formula: "function_1('extract_field', {'dict': rule_pack, 'key': 'adjacency_text'})"
  budget_text:
    formula: "function_1('extract_field', {'dict': rule_pack, 'key': 'budget_text'})"
  grouping_text:
    formula: "function_1('extract_field', {'dict': rule_pack, 'key': 'grouping_text'})"
  cluster_text:
    formula: "function_1('extract_field', {'dict': rule_pack, 'key': 'cluster_text'})"
  allowed_text:
    formula: "function_1('extract_field', {'dict': rule_pack, 'key': 'allowed_text'})"
  forbidden_text:
    formula: "function_1('extract_field', {'dict': rule_pack, 'key': 'forbidden_text'})"
  example:
    formula: "{'placements': {'A': (7, 2), 'B': (3, 7), 'C': (6, 5), 'D': (1, 4), 'E': (5, 1), 'F': (4, 3), 'G': (2, 6)}, 'score': 37, 'cost': 13}"
queries:
  q1:
    desc: '请返回字典形式答案，格式说明：placements 为按字母序的区域到坐标 (r,c) 的映射（未放置则为 None），score 为最大总价值，cost 为总成本（未放置score和cost则为-1）。请严格按键值格式书写：placements=映射，score=S，cost=C。输出样例{example}。'
    ans_formula: "function_1('solve_complex', {'rows': rows, 'cols': cols, 'regions': regions, 'region_cells': region_cells, 'value_matrix': value_matrix, 'cost_matrix': cost_matrix, 'rule_pack': rule_pack})"
    ans_text: "str(_ans)"
    ans_assertion: "True"

desc: '科研传感器布设（高阶复合约束版）：在一个 n×n 网格中放置若干星，使总价值最大。约束包含：{row_rule_text}、{col_rule_text}、{region_rule_text}、{total_rule_text}、{adjacency_text}、{budget_text}；并附加 {grouping_text} 与 {cluster_text}；允许与禁止的单元格说明：{allowed_text}；{forbidden_text}。说明：曼哈顿距离为两点行差与列差之和；切比雪夫距离为两点行差与列差的最大值；距离阈值 d 表示两颗星之间该距离必须大于 d。区域分布矩阵为 {regions_text}；价值矩阵为 {values_text}；成本矩阵为 {costs_text}。若分数并列，则按行对应列号的字典序更小者优先。请返回答案，格式说明：placements=映射，score=S，cost=C。{q1}'