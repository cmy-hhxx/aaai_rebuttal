# =================================================================
# High-complexity generalized Kakurasu (n x n) with composite randomized rules
# Reverse generation: build a unique solution first; expose all necessary parameters for human solving
# =================================================================
custom_operator:
  function_1: kukurasu_2.py
  function_2: kukurasu_2.py

variables:
  grid_size:
    type: int
    domain: "[4, 7]"

  precomp:
    formula: "function_1(grid_size)"

  ban_mode:
    formula: "precomp['ban_mode']"
  mod_base:
    formula: "precomp['mod_base']"
  perm:
    formula: "precomp['perm']"
  row_weights:
    formula: "precomp['row_weights']"
  col_weights:
    formula: "precomp['col_weights']"
  row_res:
    formula: "precomp['row_res']"
  col_res:
    formula: "precomp['col_res']"
  banned_pairs:
    formula: "precomp['banned_pairs']"
  include_col_mod:
    formula: "precomp['include_col_mod']"
  col_card_exact:
    formula: "precomp['col_card_exact']"
  min_col_req:
    formula: "precomp['min_col_req']"
  force_pairs:
    formula: "precomp['force_pairs']"

  include_group_count:
    formula: "precomp['include_group_count']"
  group_num:
    formula: "precomp['group_num']"
  group_id:
    formula: "precomp['group_id']"
  group_counts:
    formula: "precomp['group_counts']"

  include_row_link:
    formula: "precomp['include_row_link']"
  row_link_pairs:
    formula: "precomp['row_link_pairs']"
  alt_row_weights:
    formula: "precomp['alt_row_weights']"
  alt_mod:
    formula: "precomp['alt_mod']"
  row_link_targets:
    formula: "precomp['row_link_targets']"

  include_parity:
    formula: "precomp['include_parity']"
  parity_bm:
    formula: "precomp['parity_bm']"
  row_parity:
    formula: "precomp['row_parity']"

  rows:
    formula: "[str(i) for i in range(1, grid_size + 1)]"
  cols:
    formula: "[str(j) for j in range(1, grid_size + 1)]"
  num_rows:
    formula: "list(range(1, grid_size + 1))"
  num_cols:
    formula: "list(range(1, grid_size + 1))"

  rule_text:
    formula: "precomp['rule_text']"

symbols:
  cells:
    source:
    - rows
    - cols
    type: bool
    desc: 'Cell (row {_rows}, col {_cols}) is 1'

conditions:
  banned_cells_false:
    formula: "True if len(banned_pairs) == 0 else And([Not(cells[(str(i), str(j))]) for (i, j) in banned_pairs])"
    desc: '所有被禁止的坐标必须为 X。'

  row_exactly_one:
    formula: And([Sum([If(cells[(str(i), str(j))], 1, 0) for j in num_cols]) == 1 for i in num_rows])
    desc: '每行恰好 1 个 1。'

  col_cardinality:
    formula: "And([Sum([If(cells[(str(i), str(j))], 1, 0) for i in num_rows]) == 1 for j in num_cols]) if col_card_exact else And([Sum([If(cells[(str(i), str(j))], 1, 0) for i in num_rows]) >= min_col_req for j in num_cols])"
    desc: '每列要么恰 1 个 1, 要么至少达到给定最小数量。'

  row_mod:
    formula: And([Sum([If(cells[(str(i), str(j))], row_weights[j - 1], 0) for j in num_cols]) % mod_base == row_res[i - 1] for i in num_rows])
    desc: '第 i 行按行权重计算的加权和对模数取模等于给定的行余数。'

  col_mod:
    formula: "True if not include_col_mod else And([Sum([If(cells[(str(i), str(j))], col_weights[i - 1], 0) for i in num_rows]) % mod_base == col_res[j - 1] for j in num_cols])"
    desc: '若启用, 第 j 列按列权重计算的加权和对模数取模等于给定的列余数。'

  group_count:
    formula: "True if not include_group_count else And([Sum([If(cells[(str(i), str(j))], 1, 0) for i in num_rows for j in num_cols if group_id[j - 1] == g]) == group_counts[g - 1] for g in range(1, group_num + 1)])"
    desc: '若启用, 每个列分组中被选中的列数量恰为指定值。'

  row_link:
    formula: "True if not include_row_link else And([ (Sum([If(cells[(str(r1), str(j))], alt_row_weights[j - 1], 0) for j in num_cols]) + Sum([If(cells[(str(r2), str(j))], alt_row_weights[j - 1], 0) for j in num_cols])) % alt_mod == row_link_targets[idx] for idx, (r1, r2) in enumerate(row_link_pairs) ])"
    desc: '若启用, 指定行对的联合加权和对联合模数取模须等于给定目标值。'

  parity_rows:
    formula: "True if not include_parity else And([Sum([If(cells[(str(i), str(j))], parity_bm[j - 1], 0) for j in num_cols]) % 2 == row_parity[i - 1] for i in num_rows])"
    desc: '若启用, 每行在奇偶掩码下的求和对 2 取模须等于该行奇偶值。'

  forced_ones:
    formula: "True if len(force_pairs) == 0 else And([cells[(str(i), str(j))] for (i, j) in force_pairs])"
    desc: '若启用, 指定坐标必须为 1。'

queries:
  q1:
    desc: '请在 n×n 网格中填入 1 或 X, 满足题面给出的所有规则与取模约束。答案格式: 输出一个 JSON 风格的二维列表字符串, 例如 [[X,1,...], ...], 其中每个元素必须为字符串 1 或 X。'
    ans_formula: "[['1' if get_value(_solutions[0], cells[(str(i), str(j))]) else 'X' for j in num_cols] for i in num_rows]"
    ans_text: "function_2(_ans)"
    ans_assertion: "len(_solutions) == 1"

max_solution: 1

desc: '高阶模数 Kakurasu（n×n, 复合随机规则版）。题目参数与规则如下: {rule_text}。请依据上述规则在网格中填入 1 或 X 并输出二维列表答案 (元素为字符串 1 或 X)。'