# ------------------------------------------------
# Dynamic Jigsaw/Classic Sudoku with validated randomized advanced constraints
# ------------------------------------------------

# ------------------------------------------------
# Custom operators implemented in sudoku_3.py
# ------------------------------------------------
custom_operator:
  make_regions: sudoku_3.py
  make_regions_dynamic: sudoku_3.py
  build_solution: sudoku_3.py
  build_solution2: sudoku_3.py
  random_choice: sudoku_3.py
  random_perm: sudoku_3.py
  pick_givens: sudoku_3.py
  pick_target_cell: sudoku_3.py
  build_puzzle: sudoku_3.py
  format_grid: sudoku_3.py
  enc_cell_uniqueness: sudoku_3.py
  enc_row_constraints: sudoku_3.py
  enc_col_constraints: sudoku_3.py
  enc_region_constraints: sudoku_3.py
  global_digit_count: sudoku_3.py
  maybe_enforce: sudoku_3.py
  # Advanced operators
  gen_knight_pairs: sudoku_3.py
  gen_king_pairs: sudoku_3.py
  gen_adjacent_pairs: sudoku_3.py
  enc_anti_knight: sudoku_3.py
  enc_anti_king: sudoku_3.py
  enc_non_consecutive: sudoku_3.py
  enc_diagonals: sudoku_3.py
  create_thermometers_from_solution: sudoku_3.py
  enc_thermo_constraints: sudoku_3.py
  make_killer_cages_cells: sudoku_3.py
  make_killer_cages_sums: sudoku_3.py
  enc_killer_cages: sudoku_3.py
  choose_parity_even: sudoku_3.py
  choose_parity_odd: sudoku_3.py
  enc_parity: sudoku_3.py
  make_constraints_desc: sudoku_3.py
  enc_givens_lock: sudoku_3.py
  check_diagonals_valid: sudoku_3.py
  check_main_diagonal_valid: sudoku_3.py
  check_anti_diagonal_valid: sudoku_3.py
  pick_diag_type: sudoku_3.py
  # Validation helpers
  solution_satisfies_anti_knight: sudoku_3.py
  solution_satisfies_anti_king: sudoku_3.py
  solution_satisfies_non_consecutive: sudoku_3.py
  has_items: sudoku_3.py

# ------------------------------------------------
# Variables: parameterized scenario with validated regions and advanced rules
# ------------------------------------------------
variables:
  # Board size
  n:
    type: int
    domain: "[9, 9]"
    diff_factor: 0

  # Indices and keys
  rows:
    formula: "list(range(n))"
  cols:
    formula: "list(range(n))"
  digits:
    formula: "list(range(1, n + 1))"
  row_keys:
    formula: "['r' + str(i) for i in rows]"
  col_keys:
    formula: "['r'.replace('r','c') + str(j) for j in cols]"
  digit_keys:
    formula: "['d' + str(k) for k in digits]"

  # Region scheme randomized
  region_scheme:
    formula: "random_choice(['affine', 'blocks3'])"
  k_unit:
    formula: "random_choice([1, 2, 4, 5, 7, 8])"
  t_shift:
    formula: "random_choice(list(range(n)))"
  regions:
    formula: make_regions_dynamic(n, region_scheme, k_unit, t_shift)
  region_ids:
    formula: "sorted(list(set([regions[r][c] for r in rows for c in cols])))"
  region_str:
    formula: format_grid(regions)

  # Solution construction parameters
  offset:
    formula: "random_choice(list(range(n)))"
  perm:
    formula: random_perm(n)
  sol_grid:
    formula: build_solution2(n, region_scheme, offset, perm)

  # Clue budget and symmetry
  clue_num:
    type: int
    domain: "[28, 36]"
    diff_factor: -1
  symmetry:
    formula: "random_choice(['none', 'rot180', 'mirror_h', 'mirror_v'])"

  # Givens and puzzle grid
  givens:
    formula: pick_givens(sol_grid, clue_num, symmetry)
  puzzle_grid:
    formula: build_puzzle(n, sol_grid, givens)
  puzzle_str:
    formula: format_grid(puzzle_grid)

  # Targeted cell for a specific query
  target_cell:
    formula: pick_target_cell(givens, n)

  # Encoding style and optional redundancy
  rule_style:
    formula: "random_choice(['sum', 'pairwise'])"
  enable_global_digit_count:
    formula: "random_choice([True, False])"

  # Advanced feature data (global pairs)
  knight_pairs_all:
    formula: gen_knight_pairs(n)
  king_pairs_all:
    formula: gen_king_pairs(n)
  adj_pairs_all:
    formula: gen_adjacent_pairs(n)

  # Diagonals type selected consistently with solution
  diag_type:
    formula: pick_diag_type(sol_grid)

  # Thermometers (paths strictly increasing in solution)
  thermo_num:
    formula: "random_choice([1, 2, 3])"
  thermometers:
    formula: create_thermometers_from_solution(sol_grid, thermo_num, 3, 5)

  # Killer cages
  killer_cage_num:
    formula: "random_choice([2, 3, 4])"
  killer_cages_cells:
    formula: make_killer_cages_cells(sol_grid, killer_cage_num, 2, 4)
  killer_cages_sums:
    formula: make_killer_cages_sums(sol_grid, killer_cages_cells)

  # Parity hints
  parity_even_cells:
    formula: choose_parity_even(sol_grid, 10)
  parity_odd_cells:
    formula: choose_parity_odd(sol_grid, 10)

  # Feature master toggles
  enable_thermo:
    formula: "random_choice([True, False])"
  enable_killer:
    formula: "random_choice([True, False])"
  enable_parity:
    formula: "random_choice([True, False])"

  # Validated toggles: only enable features when solution supports them and data is present
  thermo_enabled:
    formula: "enable_thermo and has_items(thermometers)"
  killer_enabled:
    formula: "enable_killer and has_items(killer_cages_cells)"
  parity_enabled:
    formula: "enable_parity and (has_items(parity_even_cells) or has_items(parity_odd_cells))"

  # Validated toggles for advanced constraints that depend on the solution patterns
  enable_anti_knight:
    formula: "random_choice([True, False]) and solution_satisfies_anti_knight(sol_grid, knight_pairs_all)"
  enable_anti_king:
    formula: "random_choice([True, False]) and solution_satisfies_anti_king(sol_grid, king_pairs_all)"
  enable_non_consecutive:
    formula: "random_choice([True, False]) and solution_satisfies_non_consecutive(sol_grid, adj_pairs_all)"

  # Human-readable constraints description with full details (only enabled ones listed)
  constraints_desc:
    formula: make_constraints_desc(n, region_scheme,
      enable_anti_knight, knight_pairs_all,
      enable_anti_king, king_pairs_all,
      enable_non_consecutive, adj_pairs_all,
      diag_type,
      thermo_enabled, thermometers,
      killer_enabled, killer_cages_cells, killer_cages_sums,
      parity_enabled, parity_even_cells, parity_odd_cells)

# ------------------------------------------------
# Symbols: x[(row_key, col_key, digit_key)] is True iff cell(r,c)=digit
# ------------------------------------------------
symbols:
  x:
    source:
    - row_keys
    - col_keys
    - digit_keys
    type: bool
    desc: "Cell ({_row_keys}, {_col_keys}) is {_digit_keys}"

# ------------------------------------------------
# Conditions: unified encoders plus validated advanced constraints
# ------------------------------------------------
conditions:
  # Core Sudoku constraints
  cell_uniqueness:
    formula: enc_cell_uniqueness(x, row_keys, col_keys, digit_keys, rule_style)
    desc: "Each cell contains exactly one digit."
  latin_rows:
    formula: enc_row_constraints(x, row_keys, col_keys, digit_keys, rule_style)
    desc: "Each row contains digits 1..9 exactly once."
  latin_cols:
    formula: enc_col_constraints(x, row_keys, col_keys, digit_keys, rule_style)
    desc: "Each column contains digits 1..9 exactly once."
  latin_regions:
    formula: enc_region_constraints(x, row_keys, col_keys, digit_keys, regions, region_ids, rule_style)
    desc: "Each region contains digits 1..9 exactly once."

  # Optional redundancy: each digit appears exactly n times overall
  redundant_digit_count:
    formula: maybe_enforce(enable_global_digit_count, global_digit_count(x, row_keys, col_keys, digit_keys, n))
    desc: "Optional internal consistency: each digit appears exactly n times overall."

  # Lock the givens (from the constructed target solution)
  givens_lock:
    formula: enc_givens_lock(x, row_keys, col_keys, digit_keys, givens)
    desc: "All provided givens are fixed."

  # Advanced constraints (globally applied only when enabled and data present)
  anti_knight_cond:
    formula: maybe_enforce(enable_anti_knight, enc_anti_knight(x, row_keys, col_keys, digit_keys, knight_pairs_all))
    desc: "Anti-knight: identical digits are forbidden at chess knight distance."
  anti_king_cond:
    formula: maybe_enforce(enable_anti_king, enc_anti_king(x, row_keys, col_keys, digit_keys, king_pairs_all))
    desc: "Anti-king: identical digits are forbidden on diagonal adjacency."
  noncon_cond:
    formula: maybe_enforce(enable_non_consecutive, enc_non_consecutive(x, row_keys, col_keys, digit_keys, adj_pairs_all))
    desc: "Non-consecutive adjacency: adjacent orthogonal cells cannot be consecutive digits."
  diagonals_cond:
    formula: maybe_enforce(diag_type != 'none', enc_diagonals(x, row_keys, col_keys, digit_keys, diag_type))
    desc: "Sudoku-X: digits 1..9 appear once on enabled diagonal(s)."
  thermos_cond:
    formula: maybe_enforce(thermo_enabled, enc_thermo_constraints(x, row_keys, col_keys, digit_keys, thermometers))
    desc: "Thermometer rules: digits strictly increase along each listed path."
  killer_cond:
    formula: maybe_enforce(killer_enabled, enc_killer_cages(x, row_keys, col_keys, digit_keys, killer_cages_cells, killer_cages_sums))
    desc: "Killer cages: sums equal the listed targets."
  parity_cond:
    formula: maybe_enforce(parity_enabled, enc_parity(x, row_keys, col_keys, digit_keys, parity_even_cells, parity_odd_cells))
    desc: "Parity hints: specified cells are restricted to even or odd digits."

# ------------------------------------------------
# Uniqueness gate (engine will discard if >1 model)
# ------------------------------------------------
max_solution: 1

# ------------------------------------------------
# Queries: strict formats, decoded from the unique Z3 model
# ------------------------------------------------
queries:
  # Q1: Output the full 9x9 solution grid as a nested list string
  q1:
    desc: 'Solve the 9x9 Sudoku/Jigsaw puzzle. Rules: rows and columns each contain digits 1..9 exactly once; all regions also contain 1..9 exactly once. The region ID map (shown above) defines the regions. Extra rules enabled for this instance and their full details are listed below. The puzzle grid shows 0 for empty cells. Coordinates use 0-based indexing (rows 0..8, cols 0..8).\\nAnswer format: a single JSON-like nested list string with 9 rows, each row is a list of 9 integers. Example: [[1,2,3,4,5,6,7,8,9],[9,8,7,6,5,4,3,2,1],[...],...].'
    ans_formula: "str([[sum([k if get_value(_solutions[0], x[(row_keys[i], col_keys[j], 'd' + str(k))]) else 0 for k in digits]) for j in range(n)] for i in range(n)])"
    ans_text: "{_ans}"
    ans_assertion: "len(_solutions) == 1"

  # Q2: One specific cell value (decoded from the unique model)
  q2:
    desc: 'Report the digit at cell (r, c) = ({target_cell[0]}, {target_cell[1]}).\\nAnswer format: single integer. Example: 5.'
    ans_formula: "sum([k if get_value(_solutions[0], x[(row_keys[target_cell[0]], col_keys[target_cell[1]], 'd' + str(k))]) else 0 for k in digits])"
    ans_text: "{_ans}"
    ans_assertion: "len(_solutions) == 1"

  # Q3: The first row as a space-separated string (decoded from the unique model)
  q3:
    desc: 'Report the first row as 9 space-separated digits.\\nAnswer format: a single line string with 9 numbers separated by a single space. Example: 2 1 3 4 5 6 7 8 9.'
    ans_formula: "' '.join([str(sum([k if get_value(_solutions[0], x[(row_keys[0], col_keys[j], 'd' + str(k))]) else 0 for k in digits])) for j in range(n)])"
    ans_text: "{_ans}"
    ans_assertion: "len(_solutions) == 1"

# ------------------------------------------------
# Description (single line; single quotes; explicit \\n for newlines)
# ------------------------------------------------
desc: 'Sudoku/Jigsaw variant on a 9x9 grid with digits 1..9. Each row and each column must contain every digit once; additionally, each region must also contain every digit once. The following region map lists the region IDs (0..8) for each cell, row by row:\\n{region_str}\\nBelow is the puzzle grid with 0 meaning empty:\\n{puzzle_str}\\nExtra rules (only those enabled for this instance apply, all coordinates use 0-based indexing): {constraints_desc}\\nPlease solve the grid and answer the questions below.\\n{q1}\\n{q2}\\n{q3}'