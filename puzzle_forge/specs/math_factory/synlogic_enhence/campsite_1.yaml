custom_operator:
  function_1: campsite_1.py
  function_2: campsite_1.py

variables:
  R_low:
    type: int
    domain: "[6, 9]"
  R_high:
    type: int
    domain: "[10, 12]"
  C_low:
    type: int
    domain: "[5, 6]"
  C_high:
    type: int
    domain: "[7, 9]"

  z_pct_low:
    type: int
    domain: "[5, 15]"
  z_pct_high:
    type: int
    domain: "[20, 35]"

  s_pct_low:
    type: int
    domain: "[12, 22]"
  s_pct_high:
    type: int
    domain: "[24, 36]"

  v_pct_low:
    type: int
    domain: "[8, 16]"
  v_pct_high:
    type: int
    domain: "[18, 32]"

  max_retry:
    type: int
    domain: "[100, 200]"

  e_adj_type_pool:
    formula: "['ge1', 'eq1']"
  e_contact_pool:
    formula: "['no_touch_4', 'no_touch_8']"
  v_contact_pool:
    formula: "['no_touch_4', 'no_touch_8']"
  v_s_adj_pool:
    formula: "['none', 'no_4']"
  row_mode_pool:
    formula: "['eq', 'ge', 'le']"
  col_mode_pool:
    formula: "['eq', 'ge', 'le']"
  e_equals_s_flag_pool:
    formula: "[True, False]"

  mask_type_pool:
    formula: "['none', 'checker', 'row_parity', 'col_parity']"
  mask_on_E_pool:
    formula: "[True, False]"
  mask_on_V_pool:
    formula: "[True, False]"

  anchor_pct_low:
    type: int
    domain: "[15, 20]"
  anchor_pct_high:
    type: int
    domain: "[25, 30]"

  region_quota_pool:
    formula: "['none', 'vertical_half', 'horizontal_half']"

  v_mdist_low:
    type: int
    domain: "[1, 2]"
  v_mdist_high:
    type: int
    domain: "[2, 3]"

  slack_low:
    type: int
    domain: "[0, 1]"
  slack_high:
    type: int
    domain: "[1, 3]"

  search_time_low:
    type: int
    domain: "[6, 8]"
  search_time_high:
    type: int
    domain: "[9, 12]"

  prefer_eq_low:
    type: int
    domain: "[65, 75]"
  prefer_eq_high:
    type: int
    domain: "[80, 90]"

  instance:
    formula: "function_1(R_low, R_high, C_low, C_high, z_pct_low, z_pct_high, s_pct_low, s_pct_high, v_pct_low, v_pct_high, max_retry, e_adj_type_pool, e_contact_pool, v_contact_pool, v_s_adj_pool, row_mode_pool, col_mode_pool, e_equals_s_flag_pool, mask_type_pool, mask_on_E_pool, mask_on_V_pool, anchor_pct_low, anchor_pct_high, region_quota_pool, v_mdist_low, v_mdist_high, slack_low, slack_high, search_time_low, search_time_high, prefer_eq_low, prefer_eq_high)"

  R:
    formula: "instance['R']"
  C:
    formula: "instance['C']"
  grid:
    formula: "instance['grid']"
  row_constraints_E:
    formula: "instance['row_constraints_E']"
  row_constraints_V:
    formula: "instance['row_constraints_V']"
  col_constraints_E:
    formula: "instance['col_constraints_E']"
  col_constraints_V:
    formula: "instance['col_constraints_V']"
  region_quota_desc:
    formula: "instance['region_quota_desc']"
  mask_desc:
    formula: "instance['mask_desc']"
  anchor_desc:
    formula: "instance['anchor_desc']"
  rules_summary:
    formula: "instance['rules_summary']"
  constraints_summary:
    formula: "instance['constraints_summary']"
  S_count:
    formula: "instance['S_count']"
  E_count:
    formula: "instance['E_count']"
  V_count:
    formula: "instance['V_count']"
  final_grid:
    formula: "instance['final_grid']"
  final_grid_tuple:
    formula: "function_2(final_grid)"

symbols: {}

calc_solution: false
max_solution: 1

queries:
  q1:
    desc: '在一个 R 行 C 列的网格中，按照题内随机规则安放 E 与 V。答案格式：请以二维元组形式输出最终网格，如 ((行1的5个字符),(行2的5个字符),...)，字符集为 [S,Z,X,E,V]。'
    ans_formula: final_grid_tuple
    ans_text: "final_grid_tuple"
    ans_assertion: "True"

desc: '地铁站设施高阶版。网格尺寸 {R}x{C}。基础网格为 {grid}（仅含 S/Z/X）。规则摘要：{rules_summary}；掩码说明：{mask_desc}；锚定说明：{anchor_desc}。约束摘要：{constraints_summary}；区域配额：{region_quota_desc}。行约束 E={row_constraints_E}，V={row_constraints_V}；列约束 E={col_constraints_E}，V={col_constraints_V}。请根据这些规则与约束在网格上放置 E 与 V，并按二维元组格式输出最终网格字符阵列。'