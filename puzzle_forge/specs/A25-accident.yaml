custom_operator: 
    bayesian_color_inference: customs/accident.py
    create_color_probs: customs/accident.py
variables:
  num_colors:
    type: int
    domain: "[2, 8]"
    diff_factor: 1
  color_probs:
    formula: create_color_probs(num_colors)
  color_index:
    formula: list(range(num_colors))
  color_names:
    formula: "['黑色','白色','黄色','银色','蓝色','红色','绿色','棕色']"
  accuracy:
    formula: random.sample([0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.5,0.55,0.6,0.65,0.7,0.75,0.8,0.85,0.9],1)[0]
  said_color:
    formula: random.sample(color_index,1)[0]
symbols: {}
conditions: {}
calc_solution: false
queries:
  q1:
    desc: 请问肇事车辆为{color_names[said_color]}的概率是多少？请以小数形式回答，并保留两位小数。
    ans_formula: bayesian_color_inference(color_index,color_probs,said_color,accuracy)
    ans_text: f"{_ans:.2f}"
    ans_assertion: 'True'
desc: 某地{'，'.join(color_names[color_index[i]]+'汽车比例为'+str(int(color_probs[i]))+'%' for i in range(num_colors))}。该地某天下雨后发生了一起车祸，肇事车辆逃逸。有个目击者称看到肇事车辆是{color_names[said_color]}汽车，但专家称在车祸当天正确判断出车辆颜色的概率是{str(round(accuracy,2))}。{q1}
