custom_operator: 
    findMaximizedCapital: customs/IPO.py
    create_increasing_profits: customs/IPO.py
    create_increasing_capital: customs/IPO.py
variables:
  k: 
    type: int
    domain: "[1, 100]"
    diff_factor: 1
  n: 
    type: int
    domain: "[1, 100]"
    diff_factor: 1
  w: 
    type: int
    domain: "[0, 10]"
    diff_factor: 1
  profits:
    formula: create_increasing_profits(n)
  capital:
    formula: create_increasing_capital(n,profits)
symbols: {}
conditions: {}
calc_solution: false
queries:
  q1:
    desc: 从给定项目中选择最多 {k} 个不同项目的列表，以最大化最终资本，并输出最终可获得的最多资本。
    ans_formula: findMaximizedCapital(k, w, profits, capital)
    ans_text: str(_ans)
    ans_assertion: 'True'
desc: 某公司即将开始 IPO 。为了以更高的价格将股票卖给风险投资公司，该公司希望在 IPO 之前开展一些项目以增加其资本。 由于资源有限，它只能在 IPO 之前完成最多 {k} 个不同的项目。帮助该公司设计完成最多 {k} 个不同项目后得到最大总资本的方式。给你 {n} 个项目。对于每个项目 i ，它都有一个纯利润 profits[i] ，和启动该项目需要的最小资本 capital[i] 。最初，你的资本为 {w} 。当你完成一个项目时，你将获得纯利润，且利润将被添加到你的总资本中。假设profits=[{'、'.join(str(pro) for pro in profits)}]，capital=[{'、'.join(str(cap) for cap in capital)}]。{q1}
