# ================================================================
# 题型：按“自定义字母表顺序”对单词降序排序
# 规则：将字母 x、l、g 移到字母表开头（保持这三者在最前的相对次序为 x < l < g），
#      其余字母按正常 a~z 顺序接在后面；然后按该字母表对给定单词做降序排序。
# 说明：本题无需SMT求解，直接用自定义函数计算答案。
# 报错原因修复：YAML 中包含冒号/花括号等字符的长字符串需要用引号包裹，
#              否则可能触发 mapping 解析错误。
# ================================================================
custom_operator:
  # pf_word_sorting_0.py 中的函数
  build_custom_alphabet: pf_word_sorting_0.py
  sort_words_by_custom_alphabet: pf_word_sorting_0.py

variables:
  # 需要被移动到字母表开头的字母集合（固定为题干给定的 x,l,g）
  moved_letters:
    formula: "['x','l','g']"

  # 单词列表（固定为题干给定的7个单词）
  words:
    formula: "['yangtze','dearly','helminthagogic','hover','cariniform','zinky','fistulatome']"

  # 生成自定义字母表（用于展示/计算）
  custom_alphabet:
    formula: build_custom_alphabet(moved_letters)

symbols: {}
conditions: {}
calc_solution: false

queries:
  q1:
    # 注意：该字符串含有冒号等字符，必须用引号包裹
    desc: "将字母x，l和g移到字母表的开头后，按降序排序这些单词: {', '.join(words)}。"
    ans_formula: sort_words_by_custom_alphabet(words, moved_letters, reverse=True)
    ans_text: "', '.join(_ans)"
    ans_assertion: "len(_ans) == len(words)"

desc: "{q1}"