# 修复点：
# get_value(sol, vars) 的第一个参数应当是“单个model”，或用于取值的 _model；
# 这里传入了 _solutions（model 列表），导致 sol[vars.decl()] 报错（list 不能用 FuncDeclRef 索引）。
# 解决：在 ans_formula 中使用 _solutions[0]（本题 max_solution=1，且 ans_assertion 也保证唯一解）。

custom_operator:
  visible_count: pf_skyscraper_puzzle_0.py
  visible_count_rev: pf_skyscraper_puzzle_0.py

variables:
  n:
    type: int
    domain: "[4, 4]"

  rows:
    formula: "[f'r{i}' for i in range(n)]"
  cols:
    formula: "[f'c{i}' for i in range(n)]"

  r_ids:
    formula: list(range(n))
  c_ids:
    formula: list(range(n))

  top_clues:
    formula: "[3, 2, 3, 1]"
  bottom_clues:
    formula: "[1, 3, 2, 3]"
  left_clues:
    formula: "[3, 2, 2, 1]"
  right_clues:
    formula: "[1, 2, 2, 3]"

symbols:
  cell:
    source:
    - rows
    - cols
    type: int
    desc: "第{int(_rows[1:])+1}行第{int(_cols[1:])+1}列的高度"

conditions:
  domain_1_to_n:
    formula: And([And(cell[(rows[r], cols[c])] >= 1, cell[(rows[r], cols[c])] <= n) for r in r_ids for c in c_ids])

  row_distinct:
    formula: And([Distinct([cell[(rows[r], cols[c])] for c in c_ids]) for r in r_ids])

  col_distinct:
    formula: And([Distinct([cell[(rows[r], cols[c])] for r in r_ids]) for c in c_ids])

  left_visibility:
    formula: And([visible_count([cell[(rows[r], cols[c])] for c in c_ids]) == left_clues[r] for r in r_ids])

  right_visibility:
    formula: And([visible_count_rev([cell[(rows[r], cols[c])] for c in c_ids]) == right_clues[r] for r in r_ids])

  top_visibility:
    formula: And([visible_count([cell[(rows[r], cols[c])] for r in r_ids]) == top_clues[c] for c in c_ids])

  bottom_visibility:
    formula: And([visible_count_rev([cell[(rows[r], cols[c])] for r in r_ids]) == bottom_clues[c] for c in c_ids])

max_solution: 1

queries:
  q1:
    desc: "请解出所有格子的高度，并用Python二维列表（list of lists）输出。"
    # 注意：这里必须传入单个 model，因此用 _solutions[0]
    ans_formula: "[[get_value(_solutions[0], cell[(rows[r], cols[c])]) for c in c_ids] for r in r_ids]"
    ans_text: str(_ans)
    ans_assertion: "len(_solutions) == 1"

desc: |
  在这个 {n}×{n} 的摩天楼谜题中，每个格子需填入 1 到 {n} 的数字，代表摩天楼高度。每行每列的数字不能重复。
  上边提示(top)={top_clues}，下边提示(bottom)={bottom_clues}，
  左边提示(left)={left_clues}，右边提示(right)={right_clues}。
  {q1}